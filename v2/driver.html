<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAGA Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<style>
body{background:#E4E4E8;color:var(--fg);overflow:hidden}
[data-theme=dark] body{background:#0B0B0D}
body.embed,body.bare{background:transparent}
.shell{display:flex;height:100vh}
.panel{width:330px;flex:none;overflow-y:auto;padding:24px 20px 40px;border-right:1px solid var(--hair);background:var(--bg);font-family:"Inter",system-ui,sans-serif}
.embed .panel,.bare .panel{display:none}
.panel h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.panel .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:22px 0 8px}
.panel .sw{display:flex;gap:4px;padding:3px;background:var(--surface2);border-radius:12px}
.panel .sw button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2)}
.panel .sw button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.panel .sl{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:15px}
.panel .sl:hover{background:var(--surface2)}.panel .sl.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.notes{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);font-size:14.5px;line-height:1.5}
.notes h3{font-size:16px;margin-bottom:8px}.notes dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-top:10px}
.notes code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.panel a.out{display:block;margin-top:8px;font-size:14px;color:var(--accent-ink);font-weight:600;text-decoration:none}
.stagearea{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit{transform-origin:center center;flex:none}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:24px 16px 36px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 26%)}
.has-foot .content{padding-bottom:190px}
.online{display:flex;align-items:center;gap:16px;padding:20px;border-radius:28px;background:var(--surface)}
.online.on{background:var(--accent);color:var(--on-accent)}
.online.on .t-sub{color:inherit;opacity:.85}
.online .tgl{transform:scale(1.15)}
.online.on .tgl{background:var(--on-accent)}
.online.on .tgl::after{background:var(--accent)!important}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface);border-radius:22px;padding:14px;font-size:14px;color:var(--fg2)}
.kpis b{display:block;font-size:24px;color:var(--fg);font-weight:600;margin-top:4px;font-feature-settings:"tnum" 1}
.job{display:flex;gap:14px;padding:16px;border-radius:26px;background:var(--surface);text-align:left;width:100%;color:var(--fg)}
.job+.job{margin-top:8px}
.job time{font-size:20px;font-weight:600;min-width:62px;font-feature-settings:"tnum" 1}
.job .ty{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--accent-soft);color:var(--on-accent-soft)}
.job.next{box-shadow:inset 0 0 0 2px var(--accent)}
.req{position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 20px 36px;background:var(--bg)}
.ring{width:170px;height:170px;margin:10px auto 0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface3)}.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:503;animation:cd 15s linear forwards}
@keyframes cd{to{stroke-dashoffset:503}}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:46px;font-weight:600;line-height:1}
.turn{position:absolute;z-index:31;left:12px;right:12px;top:50px;border-radius:24px;background:var(--accent);color:var(--on-accent);padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.turn .ic{width:40px;height:40px;stroke-width:2.4}
.turn b{font-size:24px;display:block;line-height:1.1}.turn span{font-size:16px;opacity:.9}
.plate{font-family:var(--mono);font-size:14px;font-weight:500;padding:5px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--hair)}
.rider{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface2)}
.rider .ph{width:52px;height:52px;border-radius:26px;background:var(--accent-soft);color:var(--on-accent-soft);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--fg)}
.act span.c{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center}
.act.sos span.c{color:var(--danger)}
.timer{font-size:52px;font-weight:600;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.progress{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.codein{display:flex;gap:10px;justify-content:center;margin-top:20px}
.codein span{width:68px;height:80px;border-radius:20px;border:2px solid var(--fg3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:36px}
.codein span.f{border-color:var(--accent);background:var(--accent-soft);color:var(--on-accent-soft)}
.codein.ok span{border-color:var(--success);background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
.keys button{height:66px;border-radius:20px;background:var(--surface2);font-size:28px;font-weight:500;color:var(--fg)}
.batt{display:flex;align-items:flex-end;gap:16px}
.batt .big{font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em}
.cell{height:24px;border-radius:8px;background:var(--surface3);overflow:hidden;position:relative}
.cell i{position:absolute;inset:0 auto 0 0;background:var(--success);border-radius:8px}
.chk{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:6px;font-size:16.5px}
.chk:first-child{border-radius:24px 24px 6px 6px}.chk:last-child{border-radius:6px 6px 24px 24px}
.chk+.chk{margin-top:3px}
.chk .bx{width:28px;height:28px;border-radius:8px;border:2px solid var(--fg3);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.chk.on .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk .bx .ic{width:18px;height:18px;stroke-width:3}
.seal{width:96px;height:96px;border-radius:48px;margin:0 auto;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center}
.seal .ic{width:48px;height:48px;stroke-width:2.6}
.stars{display:flex;justify-content:center;gap:8px}.stars button{width:52px;height:52px;color:var(--fg3)}.stars button .ic{width:34px;height:34px}.stars button.on{color:#E8A317}.stars button.on .ic{fill:#E8A317}
.flightbox{border-radius:24px;padding:16px;background:var(--surface);display:flex;gap:14px;align-items:center}
</style>
</head>
<body>
<div class="shell">
  <aside class="panel" id="panel"></aside>
  <main class="stagearea" id="stagearea"><div class="fit" id="fit"><div class="device" id="device"><div class="screen" id="screen">
    <div class="statusbar" id="sb"></div>
    <div class="views" id="views"></div>
    <div class="sbfade" id="sbfade"></div>
    <nav class="tabbar hide" id="tabbar"></nav>
    <div class="toast" id="toast"></div>
    <div class="homebar"></div>
  </div></div></div></main>
</div>
<script src="core.js"></script>
<script>
(function () {
const S = SAGA; S.state.os = "android"; S.apply();
const L = S.L, I = S.icon, $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const EMBED = S.qs.has("embed"), BARE = S.qs.has("bare"), V = S.VEHICLE;
document.body.classList.toggle("embed", EMBED); document.body.classList.toggle("bare", BARE);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const st = { online: true, checks: [true, true, true, false, true], code: "", rating: 0 };

const btn = (label, o = {}) => `<button class="btn ${o.kind || "btn-primary"} block ${o.cls || ""}" ${o.go ? `data-go="${o.go}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""}>${o.icon ? I(o.icon) : ""}<span>${label}</span></button>`;
const bar = (title, o = {}) => `<header class="topbar"><div class="tb-row">${o.back === false ? '<span style="width:10px"></span>' : `<button class="ibtn" data-back aria-label="Back">${I("arrowl")}</button>`}<div class="tb-title">${o.large ? "" : title}</div><div class="tb-actions">${o.actions || ""}</div></div>${o.large ? `<h1 class="tb-headline">${title}</h1>` : ""}</header>`;
const row = o => `<button class="row" ${o.go ? `data-go="${o.go}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.attr || ""}>${o.icon ? `<span class="lead ${o.lc || ""}">${I(o.icon)}</span>` : ""}<span class="tx"><span class="t1" style="display:block">${o.t}</span>${o.s ? `<span class="t2" style="display:block">${o.s}</span>` : ""}</span><span class="trail">${o.trail || ""}${o.chev === false ? "" : I("chevr")}</span></button>`;
const pill = (icon, t, k = "") => `<span class="pill ${k}">${icon ? I(icon) : ""}${t}</span>`;
const sh = t => `<div class="sh"><h2>${t}</h2></div>`;
const seg = (opts, cur, act) => `<div class="seg">${opts.map(([v, l]) => `<button class="${v === cur ? "on" : ""}" data-act="${act}" data-v="${v}">${v === cur ? I("check", "sm") : ""}${l}</button>`).join("")}</div>`;

const SC = {}; const def = (id, m, r, mount) => (SC[id] = Object.assign({ id, render: r, mount }, m));

def("shift", { n: "Start of shift", foot: 1, nav: 1, what: "A 30-second vehicle check before going online: charge, cleanliness, water, chargers, tyres. Ops sees it live.", why: "The premium promise depends on every car being ready. This makes it routine and auditable.", fl: "<code>POST /shifts</code> with checklist + optional photos (<code>image_picker</code>). Charge from the vehicle telematics API if available." }, () => `
  ${bar(L("Start of shift", "షిఫ్ట్ ప్రారంభం", "शिफ़्ट शुरू"))}
  <div class="content"><div class="pad">
    <div class="card row-flex"><div class="grow"><div class="t-label">${V.make} ${V.model}</div><div class="t-h2 mt4">${V.plate}</div></div><div style="text-align:right"><div class="t-h2" style="color:var(--success)">92%</div><div class="t-sub">${L("charge", "ఛార్జ్", "चार्ज")}</div></div></div>
    <h2 class="t-h3 mt24">${L("Quick check before you go online", "ఆన్‌లైన్ ముందు తనిఖీ", "ऑनलाइन होने से पहले जाँच")}</h2>
    <div class="mt12">${[L("Cabin and seats cleaned", "క్యాబిన్, సీట్లు శుభ్రం", "केबिन और सीटें साफ़"), L("4 chilled water bottles", "4 చల్లని నీళ్ల సీసాలు", "4 ठंडी पानी की बोतलें"), L("USB-C chargers in place", "USB-C ఛార్జర్లు ఉన్నాయి", "USB-C चार्जर मौजूद"), L("Tyres and lights checked", "టైర్లు, లైట్లు తనిఖీ", "टायर और लाइट जाँचे"), L("Uniform and ID card", "యూనిఫాం, ID కార్డు", "यूनिफ़ॉर्म और ID कार्ड")].map((t, i) => `<button class="chk ${st.checks[i] ? "on" : ""}" data-act="chk" data-v="${i}" style="width:100%;text-align:left"><span class="bx">${I("check")}</span>${t}</button>`).join("")}</div>
  </div></div>
  ${`<div class="foot">${btn(st.checks.every(Boolean) ? L("Start shift", "షిఫ్ట్ ప్రారంభించు", "शिफ़्ट शुरू करें") : L(`${st.checks.filter(x => !x).length} item left`, `${st.checks.filter(x => !x).length} మిగిలి ఉంది`, `${st.checks.filter(x => !x).length} बाकी`), { go: st.checks.every(Boolean) ? "duty" : "", kind: st.checks.every(Boolean) ? "btn-primary" : "btn-secondary", cls: "lg" })}</div>`}`);

def("duty", { n: "Duty", tab: "duty", what: "Online switch, today's numbers, and the day's assigned jobs in time order: airport drops linked to flights, hotel pickups, scheduled series, and on-demand rides.", why: "Drivers are salaried, so the screen is a work plan, not an earnings hustle. Flight and hotel context is visible before the job starts.", fl: "<code>GET /driver/schedule?date=</code>, live updates over WebSocket. Online state drives location upload frequency." }, () => `
  ${bar(L("Today", "ఈ రోజు", "आज"), { back: false, large: true, actions: `<button class="ibtn" data-toast="${esc(L("No new messages from ops", "ఆప్స్ నుండి కొత్త సందేశాలు లేవు", "ऑप्स से कोई नया मैसेज नहीं"))}">${I("bell")}</button>` })}
  <div class="content"><div class="pad">
    <button class="online ${st.online ? "on" : ""}" data-act="online" style="width:100%;text-align:left"><span class="pico" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:${st.online ? "rgba(255,255,255,.18)" : "var(--surface2)"}">${I("car")}</span><div class="grow"><div class="t-h3">${st.online ? L("You're online", "మీరు ఆన్‌లైన్‌లో ఉన్నారు", "आप ऑनलाइन हैं") : L("You're offline", "మీరు ఆఫ్‌లైన్", "आप ऑफ़लाइन हैं")}</div><div class="t-sub">${st.online ? L("Shift 06:00 – 14:00 · 4 h 12 m left", "షిఫ్ట్ 06:00 – 14:00 · 4 గం 12 ని మిగిలి", "शिफ़्ट 06:00 – 14:00 · 4 घं 12 मि बाकी") : L("Tap to go online", "ఆన్‌లైన్ కావడానికి నొక్కండి", "ऑनलाइन होने के लिए दबाएँ")}</div></div><span class="tgl ${st.online ? "on" : ""}"></span></button>
    <div class="kpis mt12"><div>${L("Trips", "ట్రిప్పులు", "ट्रिप")}<b>5</b></div><div>${L("On time", "సమయానికి", "समय पर")}<b>100%</b></div><div>${L("Rating", "రేటింగ్", "रेटिंग")}<b>4.9</b></div></div>
  </div>
  ${sh(L("Your jobs", "మీ పనులు", "आपके काम"))}
  <div class="pad">
    <button class="job next" data-go="request"><time>09:00</time><div class="grow"><span class="ty">${I("repeat", "sm")}${L("Scheduled", "షెడ్యూల్", "शेड्यूल")}</span><div class="t-h3 mt8">Ananya Rao</div><div class="t-sub">MVP Colony → Dwaraka Nagar · 12 km</div></div>${I("chevr")}</button>
    <button class="job" data-go="waiting"><time>11:20</time><div class="grow"><span class="ty">${I("landing", "sm")}${L("Airport pickup", "ఎయిర్‌పోర్ట్ పికప్", "एयरपोर्ट पिकअप")}</span><div class="t-h3 mt8">Mr. S. Sharma</div><div class="t-sub">AI 1912 ${L("lands", "ల్యాండింగ్", "लैंडिंग")} 11:05 · ${L("on time", "సమయానికి", "समय पर")}</div></div>${I("chevr")}</button>
    <button class="job" data-toast="${esc(L("Hotel booking: guest at the lobby, bill to room", "హోటల్ బుకింగ్: లాబీలో అతిథి, రూమ్ బిల్", "होटल बुकिंग: लॉबी में मेहमान, रूम बिल"))}"><time>13:30</time><div class="grow"><span class="ty">${I("hotel", "sm")}${L("Hotel", "హోటల్", "होटल")}</span><div class="t-h3 mt8">${L("Guest · Room 412", "అతిథి · రూమ్ 412", "मेहमान · रूम 412")}</div><div class="t-sub">Bay Pavilion Hotel → Railway Station</div></div>${I("chevr")}</button>
  </div>
  <div class="pad mt16"><div class="card pad0" style="height:150px;overflow:hidden;border-radius:28px">${S.map({ view: [100, 160, 260, 160], car: [260, 180, 90] })}</div></div>
  </div>`);

def("request", { n: "Job offered", tabs: 0, what: "Full-screen job card with a 15-second ring: pickup distance, rider, trip type, drop. Accept, or decline with a reason.", why: "Big targets and big type so it can be read at a glance in a parked car.", fl: "High-priority FCM data message → full-screen intent (Android <code>USE_FULL_SCREEN_INTENT</code>, allowed for ride-hailing). Response: <code>POST /jobs/{id}/accept</code>." }, () => `
  <div class="req">
    <div class="center">${pill("repeat", L("Scheduled ride · repeat rider", "షెడ్యూల్ రైడ్ · రెగ్యులర్ రైడర్", "शेड्यूल राइड · नियमित सवारी"), "accent")}</div>
    <div class="ring"><svg viewBox="0 0 180 180"><circle class="bg" cx="90" cy="90" r="80"/><circle class="fg" cx="90" cy="90" r="80"/></svg><div class="c"><b>4 min</b><span class="t-sub">${L("to pickup", "పికప్‌కు", "पिकअप तक")}</span></div></div>
    <div class="rider mt24"><span class="ph">AR</span><div class="grow"><div class="t-h3">Ananya Rao</div><div class="t-sub">★ 4.8 · ${L("prefers a quiet ride", "నిశ్శబ్ద ప్రయాణం ఇష్టం", "शांत सफ़र पसंद")}</div></div></div>
    <div class="card mt12" style="padding:6px 18px">
      <div class="row-flex" style="min-height:58px"><span style="width:14px;height:14px;border-radius:7px;border:4px solid var(--accent)"></span><div class="grow"><div class="t-label">${L("Pickup", "పికప్", "पिकअप")}</div><div class="t-body">MVP Colony, Sector 4</div></div><b>1.6 km</b></div>
      <div class="hr" style="margin:0 0 0 28px"></div>
      <div class="row-flex" style="min-height:58px"><span style="width:14px;height:14px;border-radius:3px;background:var(--fg)"></span><div class="grow"><div class="t-label">${L("Drop", "డ్రాప్", "ड्रॉप")}</div><div class="t-body">Dwaraka Nagar</div></div><b>12.4 km</b></div>
    </div>
    <div style="margin-top:auto">${btn(L("Accept", "అంగీకరించు", "स्वीकार करें"), { go: "topickup", cls: "lg" })}<button class="btn btn-text block mt8" data-back>${L("Can't take this", "తీసుకోలేను", "नहीं ले सकता")}</button></div>
  </div>`);

def("topickup", { n: "To pickup", tabs: 0, map: 1, what: "Turn-by-turn banner in SAGA colours, the route on the branded map, ETA, rider, and a single 'I've arrived' action.", why: "One glance for direction, one tap when there. Calls are masked so neither number is shared.", fl: "Google Navigation SDK for Android (or hand-off to Google Maps). Masked calling via the client's telephony provider (e.g. Exotel)." }, () => `
  <div class="mapwrap">${S.map({ route: "pickup", car: [260, 210, 180], view: [79, 70, 263, 571], labelPickup: "Ananya" })}</div>
  <div class="turn">${I("arrowr")}<div><b>${L("Right onto Beach Road", "బీచ్ రోడ్ వైపు కుడికి", "बीच रोड पर दाएँ")}</b><span>300 m</span></div></div>
  <div class="sheet"><div class="grabber"></div>
