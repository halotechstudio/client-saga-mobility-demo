<!doctype html>

<head>

<title>SAGA Chauffeur</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">

<style>
body{background:#E4E4E8;color:var(--fg);overflow:hidden}
[data-theme=dark] body{background:#0B0B0D}
body.embed,body.bare{background:transparent}
.shell{display:flex;height:100vh}
.panel{width:330px;flex:none;overflow-y:auto;padding:24px 20px 40px;border-right:1px solid var(--hair);background:var(--bg);font-family:"Inter",system-ui,sans-serif}
.embed .panel,.bare .panel{display:none}
.panel h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.panel .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:22px 0 8px}
.panel .sw{display:flex;gap:4px;padding:3px;background:var(--surface2);border-radius:12px}
.panel .sw button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2)}
.panel .sw button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.panel .grp{font-size:13px;font-weight:600;color:var(--fg2);margin:16px 0 4px}
.panel .sl{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:15px}
.panel .sl:hover{background:var(--surface2)}.panel .sl.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.notes{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);font-size:14.5px;line-height:1.5}
.notes h3{font-size:16px;margin-bottom:8px}.notes dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-top:10px}
.notes code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.panel a.out{display:block;margin-top:8px;font-size:14px;color:var(--accent-ink);font-weight:600;text-decoration:none}
.stagearea{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit{transform-origin:center center;flex:none}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:24px 16px 36px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 26%)}
.has-foot .content{padding-bottom:190px}
/* onboarding */
.wl{position:absolute;inset:0;display:flex;flex-direction:column;color:#F4F4F6;padding:64px 22px 40px}
.wl .t-hero{color:#fff}
.wl-car{margin:28px -40px 0 -16px}
.wl-langs{display:flex;justify-content:center;gap:6px}
.wl-langs button{height:44px;padding:0 16px;border-radius:22px;color:#A9ABB3;font-size:15px;font-weight:600}
.wl-langs button.on{background:rgba(255,255,255,.12);color:#fff}
.vrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:6px}
.vrow:first-child{border-radius:24px 24px 6px 6px}.vrow:last-child{border-radius:6px 6px 24px 24px}.vrow+.vrow{margin-top:3px}
.vrow .vi{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);flex:none}
.vrow .vi.warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.vrow b{display:block;font-size:16.5px;font-weight:600}.vrow span.s{font-size:14px;color:var(--fg2)}
/* inspection camera */
.cam{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,#2E3239 0%,#121418 60%,#08090B 100%);color:#fff;overflow:hidden}
.cam-top{position:absolute;top:50px;left:16px;right:16px;z-index:3}
.cam-steps{display:flex;gap:4px;margin-top:12px}.cam-steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.cam-steps i.d{background:#fff}.cam-steps i.w{background:var(--warning)}.cam-steps i.c{background:var(--accent)}
.cam-title{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:14px;line-height:1.05}
.cam-hint{font-size:15px;color:#BFC2CA;margin-top:6px;line-height:1.4}
.cam-frame{position:absolute;left:22px;right:22px;top:250px;height:250px;border-radius:30px;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.cam-frame .guide{width:100%;opacity:.5}
.cam-frame .gi{color:rgba(255,255,255,.45)}.cam-frame .gi .ic{width:120px;height:120px;stroke-width:1}
.cam-frame.ok{border:2px solid var(--success)}.cam-frame.warn{border:2px solid var(--warning)}
.cam-scan{position:absolute;left:10px;right:10px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:beam 1s ease-in-out infinite alternate;top:10%}
@keyframes beam{to{top:90%}}
.cam-res{position:absolute;left:22px;right:22px;top:516px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:20px;background:rgba(255,255,255,.1);font-size:15px;animation:popin .4s both}
.cam-res .ic{flex:none}
.cam-res.ok .ic{color:#3DD68C}.cam-res.warn .ic{color:#F5B53D}
.cam-shots{position:absolute;left:16px;right:16px;bottom:150px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cam-shots span{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;position:relative}
.cam-shots span .ic{width:20px;height:20px}
.cam-shots span.w{box-shadow:inset 0 0 0 2px #F5B53D}
.shutter{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:84px;height:84px;border-radius:42px;border:5px solid #fff;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.shutter i{width:62px;height:62px;border-radius:31px;background:#fff;transition:transform .15s}
.shutter:active i{transform:scale(.85)}
.camflash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .45s forwards;z-index:9}
/* duty */
.online{display:flex;align-items:center;gap:16px;padding:22px;border-radius:32px;background:var(--surface)}
.online.on{background:var(--accent);color:var(--on-accent)}
.online.on .t-sub{color:inherit;opacity:.85}
.online .t-h3{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.online.on .tgl{background:var(--on-accent)}
.online.on .tgl::after{background:var(--accent)!important}
.radar{position:relative;display:flex;align-items:center;gap:16px;padding:18px;border-radius:28px;background:var(--ink);color:var(--on-ink);overflow:hidden}
.radar .dish{position:relative;width:64px;height:64px;border-radius:32px;border:1px solid rgba(255,255,255,.2);flex:none;overflow:hidden}
.radar .dish::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--accent) 80%,transparent) 60deg,transparent 61deg);animation:spin 2s linear infinite;border-radius:50%}
.radar .dish::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:4px;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.radar b{font-size:17px;display:block}.radar span{font-size:14px;color:var(--on-ink2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface);border-radius:26px;padding:16px;font-size:14px;color:var(--fg2)}
.kpis div:first-child{background:var(--ink);color:var(--on-ink2)}.kpis div:first-child b{color:#fff}
.kpis b{display:block;font-family:var(--display);font-size:36px;font-weight:400;letter-spacing:-.04em;line-height:1;margin-top:10px;color:var(--fg);font-feature-settings:"tnum" 1}
.job{display:flex;gap:14px;padding:16px;border-radius:28px;background:var(--surface);text-align:left;width:100%;color:var(--fg)}
.job+.job{margin-top:8px}
.job time{font-family:var(--display);font-size:26px;font-weight:400;letter-spacing:-.03em;min-width:66px}
.job .ty{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--accent-soft);color:var(--on-accent-soft)}
.job.next{background:var(--ink);color:var(--on-ink)}.job.next .t-sub{color:var(--on-ink2)}
/* assigned takeover */
.req{position:absolute;inset:0;display:flex;flex-direction:column;padding:62px 20px 36px;background:var(--accent);color:var(--on-accent)}
.req .t-sub{color:inherit;opacity:.85}
.ring{width:150px;height:150px;margin:6px auto 0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:503;animation:cd 10s linear forwards}
@keyframes cd{to{stroke-dashoffset:503}}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-size:46px;font-weight:400;line-height:1}
.rcard{background:rgba(255,255,255,.12);border-radius:24px;padding:6px 16px}
.rcard .rr{display:flex;align-items:center;gap:12px;min-height:56px}
.rcard .hr{background:rgba(255,255,255,.2)}
.req .btn-stage{background:#fff;color:#0B0C0F}
/* nav */
.turn{position:absolute;z-index:31;left:12px;right:12px;top:50px;border-radius:26px;background:var(--ink);color:#fff;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.turn .ic{width:40px;height:40px;stroke-width:2.4;color:var(--accent-ink)}
[data-theme=light] .turn .ic{color:#8FA6FF}
.turn b{font-family:var(--display);font-size:26px;display:block;line-height:1.05;font-weight:700}.turn span{font-size:16px;opacity:.8}
.plate{font-family:var(--mono);font-size:14px;font-weight:500;padding:5px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--hair)}
.rider{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface2)}
.rider .ph{width:52px;height:52px;border-radius:26px;background:var(--accent-soft);color:var(--on-accent-soft);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--fg)}
.act span.c{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;position:relative}
.act span.c i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}
.act.sos span.c{color:var(--danger)}
.timer{font-family:var(--display);font-size:64px;font-weight:400;letter-spacing:-.04em;line-height:1}
.progress{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.codein{display:flex;gap:10px;justify-content:center;margin-top:20px}
.codein span{width:68px;height:80px;border-radius:20px;border:2px solid var(--fg3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:36px}
.codein span.f{border-color:var(--accent);background:var(--accent-soft);color:var(--on-accent-soft);animation:popin .3s both}
.codein.ok span{border-color:var(--success);background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.codein.bad span{border-color:var(--danger);color:var(--danger)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
.keys button{height:66px;border-radius:20px;background:var(--surface2);font-size:28px;font-weight:500;color:var(--fg)}
.safety{position:absolute;z-index:32;left:12px;right:12px;top:150px;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;background:#F5B53D;color:#2A1B00;font-size:15px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:sheetup .5s both}
.ringc{width:190px;height:190px;margin:0 auto;position:relative}
.ringc svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc circle{fill:none;stroke-width:14;stroke-linecap:round}
.ringc .bg{stroke:var(--surface3)}.ringc .fg{stroke:var(--success);transition:stroke-dashoffset 3.2s cubic-bezier(.3,0,.2,1)}
.ringc .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc .c b{font-family:var(--display);font-size:52px;font-weight:400;letter-spacing:-.04em;line-height:1}
.seal{width:96px;height:96px;border-radius:48px;margin:0 auto;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;animation:popin .5s both}
.seal .ic{width:48px;height:48px;stroke-width:2.6}
.stars{display:flex;justify-content:center;gap:8px}.stars button{width:52px;height:52px;color:var(--fg3)}.stars button .ic{width:34px;height:34px}.stars button.on{color:#E8A317}.stars button.on .ic{fill:#E8A317}
.flightbox{border-radius:24px;padding:16px;background:var(--surface);display:flex;gap:14px;align-items:center}
.bonus{padding:20px;border-radius:30px;background:var(--accent);color:var(--on-accent)}
.bonus .big{font-family:var(--display);font-size:46px;font-weight:400;letter-spacing:-.04em;line-height:1}
.bonus .progress{background:rgba(255,255,255,.25)}.bonus .progress i{background:#fff}
.wallet{padding:22px;border-radius:32px;background:var(--ink);color:var(--on-ink)}
.wallet .big{font-family:var(--display);font-size:56px;font-weight:400;letter-spacing:-.045em;line-height:1;margin-top:8px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hair);font-size:15.5px}
.tx:last-child{border-bottom:0}.tx b{margin-left:auto;font-feature-settings:"tnum" 1}.tx .s{display:block;font-size:13.5px;color:var(--fg2)}
.tx .ti{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 16px 20px}
.bub{max-width:80%;padding:11px 14px;border-radius:20px;font-size:16px;line-height:1.35;animation:popin .3s both}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.bub small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.qr{display:flex;flex-wrap:wrap;gap:8px}
/* heads-up notification (Android) */
.hu{position:absolute;z-index:95;left:8px;right:8px;top:8px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:24px;background:var(--surface);color:var(--fg);box-shadow:0 12px 34px rgba(0,0,0,.28);transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,1.2,.3,1);cursor:pointer}
.hu.on{transform:none}
.hu .ap{width:36px;height:36px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.hu .ap .ic{width:19px;height:19px}
.hu .hd{font-size:12.5px;color:var(--fg2);display:flex;gap:6px}.hu b{display:block;font-size:15.5px;margin-top:2px}.hu p{font-size:14.5px;color:var(--fg2);margin-top:2px;line-height:1.35}
.bellb{position:relative}.bellb i{position:absolute;top:8px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nt{display:flex;gap:14px;padding:14px 16px;background:var(--surface);border-radius:6px}
.nt:first-child{border-radius:24px 24px 6px 6px}.nt:last-child{border-radius:6px 6px 24px 24px}.nt:only-child{border-radius:24px}.nt+.nt{margin-top:3px}
.nt .ni{width:42px;height:42px;border-radius:21px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.nt.new .ni{background:var(--accent);color:var(--on-accent)}
.nt b{font-size:16px;display:block}.nt p{font-size:14.5px;color:var(--fg2);margin-top:2px;line-height:1.4}.nt time{font-size:13px;color:var(--fg2);display:block;margin-top:4px}
</style>

const btn = (label, o = {}) => `<button class="btn ${o.kind || "btn-primary"} block ${o.cls || ""}" ${o.go ? `data-go="${o.go}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""}>${o.icon ? I(o.icon) : ""}<span>${label}</span></button>`;
const bar = (title, o = {}) => `<header class="topbar"><div class="tb-row">${o.back === false ? '<span style="width:10px"></span>' : `<button class="ibtn" data-back aria-label="Back">${I("arrowl")}</button>`}<div class="tb-title">${o.large ? "" : title}</div><div class="tb-actions">${o.actions || ""}</div></div>${o.large ? `<h1 class="tb-headline">${title}</h1>` : ""}</header>`;
const row = o => { const live = o.go || o.toast || o.act; const tag = live ? "button" : "div"; return `<${tag} class="row" ${o.go ? `data-go="${o.go}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""} ${o.act ? `data-act="${o.act}"` : ""}>${o.icon ? `<span class="lead ${o.lc || ""}">${I(o.icon)}</span>` : ""}<span class="tx" style="flex:1"><span class="t1" style="display:block">${o.t}</span>${o.s ? `<span class="t2" style="display:block">${o.s}</span>` : ""}</span><span class="trail">${o.trail || ""}${live ? I("chevr") : ""}</span></${tag}>`; };
const pill = (icon, t, k = "") => `<span class="pill ${k}">${icon ? I(icon) : ""}${t}</span>`;
const sh = (t, link = "") => `<div class="sh"><h2>${t}</h2>${link}</div>`;
const seg = (opts, cur, act) => `<div class="seg">${opts.map(([v, l]) => `<button class="${v === cur ? "on" : ""}" data-act="${act}" data-v="${v}">${v === cur ? I("check", "sm") : ""}${l}</button>`).join("")}</div>`;
const tgl = (on, attr = "") => `<span class="tgl ${on ? "on" : ""}" role="switch" aria-checked="${on}" ${attr}></span>`;
const bell = () => `<button class="ibtn bellb" data-go="inbox" aria-label="Notifications">${I("bell")}${st.notif ? `<i>${st.notif}</i>` : ""}</button>`;

def("inspect", { g: "Start of shift", n: "Vehicle check", sb: "light", what: "A guided photo check, inside and out: front, both sides, rear, cabins, boot, tyres and the dashboard. Each photo is checked as it's taken; marks already on record are recognised, new damage is flagged to ops.", why: "Every ride is a premium promise. The check takes a minute, protects the chauffeur from blame for old damage, and gives ops a dated record of every car, every shift.", fl: "<code>camera</code> package; photos to <code>POST /shifts/{id}/inspection</code>; damage comparison server-side against the last inspection. Odometer and charge read by on-device OCR." }, () => {
  const total = st.mode === "end" ? 4 : STEPS.length, s = STEPS[Math.min(st.step, total - 1)], last = st.shots[st.shots.length - 1];
  return `<div class="cam">
    <div class="cam-top">
      <div class="row-flex" style="justify-content:space-between"><button class="ibtn" data-back style="color:#fff">${I("close")}</button><span style="font-size:14px;color:#BFC2CA">${st.mode === "end" ? L("End-of-shift check", "షిఫ్ట్ ముగింపు తనిఖీ", "शिफ़्ट के अंत की जाँच") : L("Vehicle check", "వాహన తనిఖీ", "गाड़ी जाँच")} · ${Math.min(st.step + 1, total)} / ${total}</span><span style="width:48px"></span></div>
      <div class="cam-steps">${Array.from({ length: total }, (_, i) => `<i class="${i < st.shots.length ? (st.shots[i] === "warn" ? "w" : "d") : i === st.step ? "c" : ""}"></i>`).join("")}</div>
      <div class="cam-title">${L(...s[2])}</div>
      <div class="cam-hint">${L(...s[3])}</div>
    </div>
    <div class="cam-frame ${st.busy ? "" : last && st.justShot ? last : ""}">${s[4] === "side" ? `<div class="guide">${S.car({ reflect: false })}</div>` : `<span class="gi">${I(s[1])}</span>`}${st.busy ? '<span class="cam-scan"></span>' : ""}</div>
    ${st.busy ? `<div class="cam-res">${I("spark")}${L("Checking the photo…", "ఫోటో తనిఖీ చేస్తున్నాం…", "फ़ोटो जाँच रहे हैं…")}</div>` : st.justShot ? `<div class="cam-res ${last}">${I(last === "warn" ? "alert" : "check")}${st.lastNote}</div>` : ""}
    <div class="cam-shots">${st.shots.map((r, i) => `<span class="${r === "warn" ? "w" : ""}">${I(STEPS[i][1])}</span>`).join("")}</div>
    <button class="shutter" data-act="shoot" aria-label="${L("Take photo", "ఫోటో తీయండి", "फ़ोटो लें")}"><i></i></button>
    ${st.flash ? '<div class="camflash"></div>' : ""}
  </div>`;
});

  const warn = st.shots.filter(x => x === "warn").length;

def("assigned", { g: "On duty", n: "Job assigned", what: "Full-screen brief in the brand colour: rider, pickup, drop, trip type, and a 10-second ring that acknowledges by itself. No accept / reject.", why: "Salaried model: jobs are assigned, not auctioned. The chauffeur gets a clear brief, not a decision under time pressure.", fl: "High-priority FCM data message → full-screen intent. <code>POST /jobs/{id}/ack</code>. In the suite, this is triggered by the rider sliding to book." }, () => `

      ${(st.job.stops || []).map((x, i) => `<div class="rr"><span class="sn">${i + 1}</span><div class="grow"><b>${x.n}</b><div class="t-sub">${x.type === "pickup" ? L("Pick up another passenger", "మరో ప్రయాణికుడిని ఎక్కించుకోండి", "दूसरे यात्री को लें") : L("Stop · wait up to 5 min", "స్టాప్ · 5 నిమి వరకు వేచి ఉండండి", "स्टॉप · 5 मिनट तक रुकें")}</div></div></div>`).join("")}

def("waiting", { g: "On the job", n: "At pickup", nav: 1, foot: 1, what: "Free-wait timer and rider status. For airport pickups, the flight's landing time and belt; the wait starts from landing.", why: "Removes guesswork at Arrivals; the rider sees the same.", fl: "Waiting rules from <code>GET /policies</code>." }, () => `

def("code", { g: "On the job", n: "Start with code", nav: 1, what: "The chauffeur types the rider's 4-digit code. Digits pop in; a wrong code shakes red; the right one turns green and the rider's app moves into the ride by itself.", why: "Prevents wrong-car pickups at busy airports and hotel porches.", fl: "<code>POST /rides/{id}/start {code}</code>; three wrong tries alert ops." }, () => `

document.addEventListener("click", e => {
