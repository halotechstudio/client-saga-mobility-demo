<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAGA Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<style>
body{background:#E4E4E8;color:var(--fg);overflow:hidden}
[data-theme=dark] body{background:#0B0B0D}
body.embed,body.bare{background:transparent}
.shell{display:flex;height:100vh}
.panel{width:330px;flex:none;overflow-y:auto;padding:24px 20px 40px;border-right:1px solid var(--hair);background:var(--bg);font-family:"Inter",system-ui,sans-serif;scrollbar-width:thin}
.embed .panel,.bare .panel{display:none}
.panel h1{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:22px 0 8px}
.panel .sw{display:flex;gap:4px;padding:3px;background:var(--surface2);border-radius:12px}
.panel .sw button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2)}
.panel .sw button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.panel .grp{font-size:13px;font-weight:600;color:var(--fg2);margin:16px 0 4px}
.panel .sl{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--fg)}
.panel .sl:hover{background:var(--surface2)}
.panel .sl.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.notes{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);font-size:14.5px;line-height:1.5}
.notes h3{font-size:16px;margin-bottom:8px}
.notes dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-top:10px}
.notes code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.panel a.out{display:block;margin-top:8px;font-size:14px;color:var(--accent-ink);font-weight:600;text-decoration:none}
.stagearea{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit{transform-origin:center center;flex:none}

/* ---- rider specific ---- */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 0;height:60px}
.home-head .r{display:flex;gap:10px;align-items:center}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--accent-soft);color:var(--on-accent-soft);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.avatar.xl{width:64px;height:64px;border-radius:32px;font-size:22px}
.bellwrap{position:relative}.bellwrap i{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--danger);border:2px solid var(--bg)}
.search{display:flex;align-items:center;gap:12px;width:calc(100% - 40px);margin:14px 20px 0;height:62px;border-radius:31px;background:var(--surface);padding:0 8px 0 20px;font-size:18px;font-weight:600;box-shadow:var(--shadow);color:var(--fg)}
.search .ph{flex:1;text-align:left}
.search .mic{width:48px;height:48px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
[data-os=android] .search{height:64px;border-radius:32px;background:var(--surface2);box-shadow:none;font-weight:400;padding-left:18px}
[data-os=android] .search .mic{background:none;color:var(--fg)}
.places{margin-top:14px}
.greet{padding:14px 20px 0}
.greet .t-label{font-weight:500}
.air{display:block;width:calc(100% - 40px);margin:16px 20px 0;padding:20px;border-radius:28px;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.air .plane{position:absolute;right:-18px;top:18px;width:150px;height:150px;opacity:.08;color:#fff}
.air .plane .ic{width:150px;height:150px;stroke-width:1}
.pnrm{display:flex;gap:6px;align-items:center}
.pnrm span{width:38px;height:48px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-family:var(--mono);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:18px}
.pnrm .go{margin-left:auto;width:48px;height:48px;border-radius:24px;background:#fff;color:#0B0C0F;display:flex;align-items:center;justify-content:center;border:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;margin-top:12px}
.tile{background:var(--surface);border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:140px;color:var(--fg)}
.tile .tic{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.tile b{font-size:18px;font-weight:600}.tile span{font-size:14.5px;color:var(--fg2);line-height:1.35}
[data-os=android] .tile{border-radius:28px;background:var(--surface2)}
[data-os=android] .tile .tic{border-radius:23px}
[data-os=android] .tile b{font-weight:500}
.sugg{margin:16px 20px 0;border:1px solid var(--hair)}
.sugg .sq{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.showcase{margin:0 20px;cursor:pointer;position:relative}
.showcase .sc-t{padding:20px 20px 0}
.showcase .sc-car{margin:4px 0 -42px;padding:0 6px}
.showcase .specs{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 20px;position:relative}
.nearby{margin:0 20px;cursor:pointer}
.nearby .nb-map{height:150px;position:relative}
.nearby .nb-tx{padding:14px 18px}
.dotlive{width:10px;height:10px;border-radius:5px;background:var(--success);box-shadow:0 0 0 5px color-mix(in srgb,var(--success) 22%,transparent);flex:none;margin:0 4px}
.upc{margin:0 20px}
.wl{position:absolute;inset:0;display:flex;flex-direction:column;color:#F4F4F6}
.wl-top{padding:70px 24px 0;display:flex;justify-content:center}
.wl-top .wordmark{font-size:20px;color:#fff}.wl-top .logo-img{height:30px}
.wl-car{margin:34px -40px 0 -10px}
.wl-body{margin-top:auto;padding:0 24px 40px}
.wl-body .t-body{color:#A9ABB3}
.wl-langs{display:flex;justify-content:center;gap:6px}
.wl-langs button{height:44px;padding:0 16px;border-radius:22px;color:#A9ABB3;font-size:15px;font-weight:600}
.wl-langs button.on{background:rgba(255,255,255,.12);color:#fff}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:24px 20px 36px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 26%)}
.has-foot .content{padding-bottom:190px}
.vline{width:1px;height:26px;background:var(--hair)}
.permrow{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.permrow+.permrow{border-top:1px solid var(--hair)}
[data-os=android] .permrow+.permrow{border-top:0;margin-top:3px}
.permrow .t1{font-size:17px;font-weight:600}.permrow .t2{font-size:15px;color:var(--fg2);margin-top:3px;line-height:1.4}
.permcard{margin:0 16px;background:var(--surface);border-radius:26px;overflow:hidden}
[data-os=android] .permcard{background:none;display:grid;gap:3px;border-radius:0}
[data-os=android] .permcard .permrow{background:var(--surface);border-radius:6px}
[data-os=android] .permcard .permrow:first-child{border-radius:24px 24px 6px 6px}[data-os=android] .permcard .permrow:last-child{border-radius:6px 6px 24px 24px}
.pico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
[data-os=android] .pico{border-radius:20px}
/* map screens */
.mapbtns{position:absolute;z-index:31;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;top:62px}
[data-os=android] .mapbtns{top:52px}
[data-os=android] .mapbtns .gbtn{background:var(--surface);border:0;backdrop-filter:none;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:16px}
.mapwrap.h55{bottom:auto;height:56%}
.optcar{margin:-10px auto -14px;max-width:300px}
.price{text-align:right}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.lineitem{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:7px 0}
.lineitem.total{font-size:18px;font-weight:700;border-top:1px solid var(--hair);margin-top:6px;padding-top:12px}
.progress{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.progress.ind i{width:40%;animation:ind 1.4s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.drv{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface2)}
[data-os=android] .drv{background:var(--surface2)}
.drv .ph{width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,#C9A57A,#7B5A3A);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;position:relative}
.drv .ph b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--fg);font-size:12px;padding:1px 6px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.plate{font-family:var(--mono);font-size:14px;font-weight:500;padding:5px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--hair);white-space:nowrap}
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox span{flex:1;height:64px;border-radius:18px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;font-weight:500}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--fg)}
.act span.c{width:56px;height:56px;border-radius:28px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
[data-os=android] .act span.c{border-radius:18px;background:var(--accent-soft);color:var(--on-accent-soft)}
.act.sos span.c{color:var(--danger)}
.toppill{position:absolute;z-index:31;left:50%;transform:translateX(-50%);top:62px;height:48px;padding:0 18px;border-radius:24px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:0 4px 14px rgba(0,0,0,.1)}
[data-os=android] .toppill{top:54px;background:var(--surface);border:0;box-shadow:0 2px 8px rgba(0,0,0,.16)}
.demo{display:block;margin:14px auto 0;font-size:14px;font-weight:600;color:var(--fg2);border:1.5px dashed var(--hair);border-radius:12px;padding:8px 14px}
.seal{width:96px;height:96px;border-radius:48px;margin:0 auto;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px color-mix(in srgb,var(--accent) 40%,transparent)}
.seal .ic{width:48px;height:48px;stroke-width:2.4}
.seal path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stars{display:flex;justify-content:center;gap:8px}
.stars button{width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.stars button .ic{width:36px;height:36px}
.stars button.on{color:#E8A317}.stars button.on .ic{fill:#E8A317}
.ticket{background:var(--surface);border-radius:26px;position:relative;overflow:hidden}
.ticket .tk-top{padding:18px 20px}
.ticket .tk-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.ticket .iata{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1}
.ticket .tk-line{flex:1;display:flex;align-items:center;gap:6px;color:var(--fg3)}
.ticket .tk-line i{flex:1;border-top:1.5px dashed var(--fg3)}
.ticket .tk-cut{position:relative;height:0;border-top:1.5px dashed var(--hair);margin:0 20px}
.ticket .tk-cut::before,.ticket .tk-cut::after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:13px;background:var(--bg)}
.ticket .tk-cut::before{left:-33px}.ticket .tk-cut::after{right:-33px}
.ticket .tk-bot{padding:14px 20px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ticket .tk-bot b{display:block;font-size:16px;margin-top:2px}
.tl{padding:6px 0}
.tli{display:grid;grid-template-columns:72px 18px 1fr;gap:10px;position:relative;padding:9px 0}
.tli time{font-size:17px;font-weight:700;font-feature-settings:"tnum" 1;text-align:right}
.tli .d{width:12px;height:12px;border-radius:6px;background:var(--surface3);margin:5px auto 0;position:relative;z-index:1}
.tli.on .d{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tli:not(:last-child)::after{content:"";position:absolute;left:calc(72px + 10px + 8px);top:27px;bottom:-9px;width:2px;background:var(--surface3)}
.tli .x b{font-size:16.5px;display:block}.tli .x span{font-size:14.5px;color:var(--fg2)}
.tli.mut time,.tli.mut b{color:var(--fg2);font-weight:500}
.days{display:flex;gap:6px;justify-content:space-between}
.days button{width:46px;height:46px;border-radius:23px;background:var(--surface);font-weight:600;font-size:15px;color:var(--fg)}
.days button.on{background:var(--accent);color:var(--on-accent)}
[data-os=android] .days button{background:var(--surface2)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .dn{font-size:13px;font-weight:600;color:var(--fg2);height:26px}
.cd{height:42px;display:flex;align-items:center;justify-content:center;border-radius:21px;font-size:15.5px;position:relative;font-feature-settings:"tnum" 1}
.cd.past{color:var(--fg3)}
.cd.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cd.skip{color:var(--fg3);text-decoration:line-through}
.cd.flight{background:var(--fg);color:var(--bg);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--fg2);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-1px;margin-right:6px}
.dests{display:flex;flex-wrap:wrap;gap:8px}
.vhero{position:relative;padding:110px 0 0;min-height:440px}
.vhero .vcar{margin:20px -30px -60px -10px}
.vhero .vt{padding:0 24px}
.spec4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spec4 div{background:var(--surface);border-radius:20px;padding:14px 8px;text-align:center;font-size:14px;color:var(--fg2)}
.spec4 b{display:block;font-size:18px;color:var(--fg);margin-top:6px}
.spec4 .ic{color:var(--accent-ink)}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amen div{background:var(--surface);border-radius:20px;padding:16px;font-size:15.5px;line-height:1.35;display:flex;flex-direction:column;gap:10px}
.amen .ic{color:var(--accent-ink)}
[data-os=android] .amen div,[data-os=android] .spec4 div{background:var(--surface2)}
.seatcard{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.offer{display:flex;gap:14px;padding:18px;border-radius:26px;background:var(--surface);align-items:flex-start}
.offer+.offer{margin-top:10px}
.offer .oi{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.offer .code{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:14px;padding:5px 10px;border-radius:8px;border:1.5px dashed var(--accent-ink);color:var(--accent-ink)}
[data-os=android] .offer{border-radius:28px;background:var(--surface2)}
.pts{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1}
.notif{display:flex;gap:14px;padding:16px 18px;position:relative}
.notif+.notif{border-top:1px solid var(--hair)}
.notif .ni{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.notif.new .ni{background:var(--accent);color:var(--on-accent)}
.notif b{font-size:16.5px;display:block}.notif p{font-size:15px;color:var(--fg2);margin-top:2px;line-height:1.4}.notif time{font-size:13.5px;color:var(--fg2);margin-top:4px;display:block}
[data-os=android] .notif .ni{border-radius:22px}
.lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 10%,#2B3448 0%,#12151C 45%,#07080A 100%);color:#fff;overflow:hidden}
.lock .lk-date{text-align:center;padding-top:82px;font-size:20px;font-weight:600;opacity:.9}
.lock .lk-time{text-align:center;font-size:96px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:4px}
[data-os=android] .lock .lk-date{text-align:left;padding:74px 28px 0;font-size:17px}
[data-os=android] .lock .lk-time{text-align:left;padding:0 24px;font-size:104px;font-weight:400;line-height:.95}
.lk-stack{position:absolute;left:12px;right:12px;bottom:110px;display:flex;flex-direction:column;gap:8px}
.la{border-radius:26px;padding:16px 18px;background:rgba(30,32,38,.72);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.la .la-h{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#C9CBD2}
.la .la-h .wordmark{font-size:13px;color:#fff}.la .la-h .logo-img{height:16px}
.la .la-big{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.la .trk{display:flex;align-items:center;gap:8px;margin-top:12px}
.la .trk .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);position:relative}
.la .trk .bar i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:3px;background:var(--accent)}
.la .trk .bar b{position:absolute;left:62%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:13px;background:#fff;color:#0B0C0F;display:flex;align-items:center;justify-content:center}
.la .trk .bar b .ic{width:16px;height:16px}
.nt{border-radius:22px;padding:13px 16px;background:rgba(40,42,48,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);display:flex;gap:12px}
.nt .ap{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:15px}
.nt b{font-size:15.5px;display:block}.nt p{font-size:15px;color:#D5D7DD;line-height:1.35}.nt time{font-size:13px;color:#9EA1A9;float:right}
[data-os=android] .la,[data-os=android] .nt{border-radius:28px;background:rgba(36,38,44,.9);backdrop-filter:none}
[data-os=android] .nt .ap{border-radius:19px}
.lk-hint{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:14px;color:#9EA1A9}
/* voice */
@property --va{syntax:"<angle>";initial-value:0deg;inherits:false}
.voice{position:absolute;inset:0;z-index:85;pointer-events:none;opacity:0;transition:opacity .3s}
.voice.on{pointer-events:auto;opacity:1}
.voice .vscrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.voice .edge{position:absolute;inset:0;padding:5px;border-radius:inherit;background:conic-gradient(from var(--va),var(--accent),var(--accent-soft),#FFFFFF,var(--accent),var(--accent-soft),var(--accent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(5px);opacity:.9;animation:va 4s linear infinite}
@keyframes va{to{--va:360deg}}
[data-os=android] .voice .edge{display:none}

def("finding", { g: "Ride", n: "Finding a car", tabs: 0, map: 1, what: "A calm search state: the map pulses around the pickup while three steps tick off (booking received, matching the nearest car, pre-cooling the cabin). With the chauffeur app open, the real assignment moves it on.", why: "With a small fleet, the next screen depends on real availability. Showing what is happening makes the wait feel shorter and honest.", fl: "<code>POST /rides</code> then a WebSocket channel for assignment. Timeout → <code>no_cars</code> state with <code>next_free_eta</code>." }, () => `
  <div class="mapwrap">${S.map({ view: [32, 48, 335, 728], pulse: true, pickup: true, cars: [[260, 180, 90], [180, 440, 0, "busy"], [60, 260, 0, "busy"], [340, 560, 0, "busy"]] })}</div>

    <div class="bk-h mt4">${L("Finding your chauffeur", "మీ డ్రైవర్‌ను వెతుకుతున్నాం", "आपका ड्राइवर ढूँढ रहे हैं")}</div>
    <div class="bf-bar mt12"><i></i></div>

def("nocars", { g: "Ride", n: "No cars nearby", tabs: 0, nav: 1, foot: 1, what: "An honest, warm message from a growing start-up. The car cut-out sits in a soft pool of light, ringed by a waitlist clock: sixty ticks that go dark one by one as the next free car gets closer, with the real minutes in the middle and the rider's place in line.", why: "Riders forgive a wait they're told about. They don't forgive a spinner. A real countdown keeps the booking instead of losing it to another app.", fl: "<code>no_cars</code> response carries <code>next_free_eta</code> and queue position. Joining the line: <code>POST /rides/{id}/waitlist</code>. Ring: <code>CustomPainter</code>, 60 ticks, opacity only." }, () => `
  ${bar(L("Your ride", "మీ రైడ్", "आपकी राइड"))}
  <div class="content">
    <div class="pad center">
      <div class="nc-stage">
        <div class="nc-ring" aria-hidden="true">${Array.from({ length: 60 }, (_, i) => `<i style="--a:${i * 6}deg"></i>`).join("")}<span class="nc-orbit"><b></b></span></div>
        <div class="nc-mid"><span class="eyebrow">${L("Next car", "తదుపరి కారు", "अगली गाड़ी")}</span><b class="nc-t t-num" id="nccd">14:00</b><small>${L("You're 1st in line", "మీరు మొదటి స్థానంలో", "आप पहले नंबर पर")}</small></div>
        <img class="nc-car" src="${SagaStage.src("cut5-side")}" alt="${V.short}">
      </div>
      <h1 class="t-title mt8">${L("All our cars are on trips right now", "మా కార్లన్నీ ఇప్పుడు ప్రయాణాల్లో ఉన్నాయి", "हमारी सभी गाड़ियाँ अभी सफ़र पर हैं")}</h1>
      <p class="t-body muted mt12">${L("We're a young company adding cars every month. Your fare and your place in line are held.", "మేము నెల నెలా కార్లు చేరుస్తున్న కొత్త సంస్థ. మీ ఛార్జీ, మీ స్థానం అలాగే ఉంటాయి.", "हम हर महीने गाड़ियाँ जोड़ रही नई कंपनी हैं। आपका किराया और लाइन में जगह बनी रहेगी।")}</p>
    </div>
    <div class="pad mt16"><div class="nc-perks">
      <div class="nc-perk">${I("snow")}<b>22°</b><small>${L("Cabin cooled", "చల్లని క్యాబిన్", "ठंडा केबिन")}</small></div>
      <div class="nc-perk">${I("tag")}<b>${S.inr(FARE)}</b><small>${L("Fare held", "ఛార్జీ మారదు", "किराया तय")}</small></div>
      <div class="nc-perk">${I("gift")}<b>+50</b><small>${L("Points for waiting", "వేచినందుకు పాయింట్లు", "इंतज़ार के पॉइंट")}</small></div>
    </div></div>
  </div>
  ${foot(`${btn(L("Wait for the next car", "తదుపరి కారు కోసం వేచి ఉంటాను", "अगली गाड़ी का इंतज़ार करूँगा"), { act: "waitline" })}<div class="btnrow mt8">${btn(L("Schedule", "షెడ్యూల్", "शेड्यूल"), { kind: "btn-secondary", go: "schedule" })}${btn(L("Notify me", "నాకు తెలపండి", "मुझे बताएँ"), { kind: "btn-secondary", act: "notifyme" })}</div>`)}`, el => {
  /* the waitlist clock: 14 minutes, one tick of the ring goes dark every 14 s; the digits count every second */
  const t0 = Date.now(), total = 14 * 60, ticks = [...el.querySelectorAll(".nc-ring i")], cd = el.querySelector("#nccd");
  const tick = () => {
    if (cur !== "nocars") return;
    const left = Math.max(0, total - Math.floor((Date.now() - t0) / 1000) - 0), lit = Math.ceil(left / total * 60);
    cd.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    ticks.forEach((t, i) => t.classList.toggle("on", i < lit));
    timers.push(setTimeout(tick, 1000));
  };
  tick();
});

  <div class="content">

    <div class="pad mt16"><div class="ap-scan lg-brand">

    </div></div>
    ${dep && app.travel.mail ? `${sh(L("Found for you", "మీ కోసం కనుగొన్నది", "आपके लिए मिली"))}<div class="pad"><button class="ap-found lg-live" data-act="pickf" data-no="6E 2134" data-t="07:40" data-day="20" data-city="HYD" data-dir="dep" data-pnr="K7QX2M"><span class="ap-f-ic">${I("mail")}</span><span class="grow"><b><span class="t-num">7:40 AM</span> · 6E 2134</b><small>${L("Fri 20 Nov", "శుక్ర 20 నవం", "शुक्र 20 नवं")} · VTZ → HYD · ${L("from your Gmail filter", "మీ Gmail ఫిల్టర్ నుండి", "आपके Gmail फ़िल्टर से")}</small></span>${I("chevr")}</button></div>` : ""}

const seriesCalc = () => {
  let n = 0; for (let d = 16; d <= 30; d++) { const wd = new Date(2026, 10, d).getDay(); if (app.days.includes(wd) && !app.skips.includes(d)) n++; }
  let dec = 0; for (let d = 1; d <= 12; d++) if (app.days.includes(new Date(2026, 11, d).getDay())) dec++;
  const rides = (n + dec) * (app.ret ? 2 : 1), per = 252, full = rides * per, total = Math.round(full * .9);
  return { rides, per, full, save: full - total, total, week: Math.round(app.days.length * (app.ret ? 2 : 1) * per * .9) };
};
const icCalc = () => { const km = KM[app.idest], rt = app.itrip === "round", dist = rt ? km * 2 : km, base = Math.round(dist * 18), wait = rt ? 600 : 0, toll = km > 100 ? 120 : 60; return { km, rt, dist, base, wait, toll, fare: base + wait + toll, adv: Math.round((base + wait + toll) * .2 / 10) * 10 }; };

def("schedule", { g: "Scheduled", n: "Scheduled rides", tabs: 0, nav: 1, foot: 1, what: "Home to Office at 9:00 AM. A week strip whose chosen days light up one after another, a glass calendar of every ride (tap a date to skip it), return ride and same-chauffeur switches, and a lit series card: how many rides, the next one, and the weekday-plan price.", why: "Office and school runs are steady revenue for a small fleet, and they're planned days ahead, which helps dispatch. Seeing the whole series at once makes it feel like a plan, not a chore.", fl: "Stored as an RRULE (RFC 5545) + exceptions. Server expands it 14 days ahead into real bookings so dispatch can plan. <code>POST /series</code>." }, () => {
  const base = new Date(2026, 10, 15), Y = 2026, M = 10, first = new Date(Y, M, 1).getDay(), dim = 30;
  const dn = [L("S", "ఆ", "र"), L("M", "సో", "सो"), L("T", "మం", "मं"), L("W", "బు", "बु"), L("T", "గు", "गु"), L("F", "శు", "शु"), L("S", "శ", "श")];
  const dl = [L("Sun", "ఆది", "रवि"), L("Mon", "సోమ", "सोम"), L("Tue", "మంగళ", "मंगल"), L("Wed", "బుధ", "बुध"), L("Thu", "గురు", "गुरु"), L("Fri", "శుక్ర", "शुक्र"), L("Sat", "శని", "शनि")];
  let cells = dn.map(d => `<span class="dn">${d}</span>`).join("");
  for (let i = 0; i < first; i++) cells += "<span></span>";
  let n = 0, next = 0;
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(Y, M, d), wd = dt.getDay(), past = dt < base, sk = app.skips.includes(d);
    const on = !past && app.days.includes(wd);
    if (on && !sk) { n++; if (!next && d > 15) next = d; }
    cells += on ? `<button class="cd on ${sk ? "skip" : ""}" data-act="skip" data-v="${d}" style="--d:${(d - 15) * 30}ms" aria-label="${d} ${L("Nov", "నవం", "नवं")}${sk ? " · " + L("skipped", "దాటవేశారు", "छोड़ा") : ""}">${d}</button>` : `<span class="cd ${past ? "past" : ""} ${d === 15 ? "today" : ""}">${d}</span>`;
  }
  let dec = 0; for (let d = 1; d <= 12; d++) if (app.days.includes(new Date(2026, 11, d).getDay())) dec++;
  const rides = (n + dec) * (app.ret ? 2 : 1), per = 252, total = Math.round(rides * per * .9);
  const nd = next ? `${dl[new Date(Y, M, next).getDay()]} ${next} ${L("Nov", "నవం", "नवं")}` : "—";
  return `${bar(L("Scheduled rides", "షెడ్యూల్ రైడ్‌లు", "शेड्यूल राइड"), { large: true })}
  <div class="content">
    <div class="pad"><div class="route sc-rt">
      <div class="rt-row"><span class="rt-dot p"></span><button class="grow rt-edit" data-act="pickplace" data-s="sch" data-f="from"><div class="t-label">${L("From", "నుండి", "से")}</div><div class="rt-v">${pl(app.sch.from)}${I("edit", "sm")}</div></button><button class="sc-time" data-act="picktime" data-s="sch" data-f="t">${I("clock", "sm")}${tfmt(app.sch.t)}</button></div>
      <div class="rt-row"><span class="rt-dot d"></span><button class="grow rt-edit" data-act="pickplace" data-s="sch" data-f="to"><div class="t-label">${L("To", "కు", "तक")}</div><div class="rt-v">${pl(app.sch.to)}${I("edit", "sm")}</div></button>${app.ret ? `<button class="sc-time" data-act="picktime" data-s="sch" data-f="back">${I("repeat", "sm")}${tfmt(app.sch.back)}</button>` : ""}</div>
    </div></div>
    ${sh(L("Repeat on", "ఈ రోజుల్లో", "इन दिनों"))}
    <div class="pad"><div class="wk">${[1, 2, 3, 4, 5, 6, 0].map((d, i) => `<button class="${app.days.includes(d) ? "on" : ""}" style="--d:${120 + i * 90}ms" data-act="day" data-v="${d}" aria-pressed="${app.days.includes(d)}"><b>${dl[d]}</b><small>${app.days.includes(d) ? "9:00" : "—"}</small><i></i></button>`).join("")}</div></div>
    <div class="pad mt16"><div class="sc-series lg-brand">
      <div class="sc-s-top"><span class="eyebrow">${L("Weekday plan", "వీక్‌డే ప్లాన్", "वीकडे प्लान")}</span><span class="sc-off">−10%</span></div>
      <div class="sc-s-mid"><b class="t-num" data-count="${rides}">${rides}</b><span>${L("rides until<br>Sat 12 Dec", "రైడ్‌లు<br>శని 12 డిసెం వరకు", "राइड<br>शनि 12 दिसं तक")}</span></div>
      <div class="sc-s-bot"><div><small>${L("Next ride", "తదుపరి రైడ్", "अगली राइड")}</small><b>${nd} · 9:00 AM</b></div><div class="r"><small>${L(`₹${per} each`, `ఒక్కొక్కటి ₹${per}`, `₹${per} प्रति राइड`)}</small><b>${S.inr(total)}</b></div></div>
    </div></div>
    <div class="pad mt16"><div class="card sc-cal">
      <div class="calhead"><b style="font-size:18px">${L("November 2026", "నవంబర్ 2026", "नवंबर 2026")}</b><span class="t-sub">${L("Tap a date to skip", "దాటవేయడానికి తేదీ నొక్కండి", "छोड़ने के लिए तारीख़ दबाएँ")}</span></div>
      <div class="calg">${cells}</div>
      <div class="legend"><span><i class="lg-on"></i>${L("Ride", "రైడ్", "राइड")}</span><span><i class="lg-today"></i>${L("Today", "ఈ రోజు", "आज")}</span><span style="text-decoration:line-through">${L("Skipped", "దాటవేసినవి", "छोड़ा गया")}</span></div>
    </div></div>
    <div class="group mt12">
      <div class="row"><span class="lead">${I("repeat")}</span><span class="tx"><span class="t1" style="display:block">${L(`Return ride at ${tfmt(app.sch.back)}`, `${tfmt(app.sch.back)}కి తిరుగు రైడ్`, `${tfmt(app.sch.back)} पर वापसी राइड`)}</span></span>${tgl(app.ret, 'data-act="ret"')}</div>
      <div class="row"><span class="lead">${I("user")}</span><span class="tx"><span class="t1" style="display:block">${L("Prefer the same chauffeur", "అదే డ్రైవర్ కావాలి", "वही ड्राइवर चाहिए")}</span><span class="t2" style="display:block">${L("We'll try every day", "ప్రతి రోజు ప్రయత్నిస్తాం", "हर दिन कोशिश करेंगे")}</span></span>${tgl(app.same, 'data-act="same"')}</div>
      ${row({ icon: "cal", t: L("Ends", "ముగింపు", "खत्म"), trail: L("Sat 12 Dec", "శని 12 డిసెం", "शनि 12 दिसं"), toast: L("Pick any end date, or keep it running until you stop it", "ఏ ముగింపు తేదీ అయినా ఎంచుకోండి, లేదా మీరు ఆపే వరకు కొనసాగించండి", "कोई भी आख़िरी तारीख़ चुनें, या रोकने तक चालू रखें") })}
    </div>
  </div>
  ${foot(btn(L(`Schedule ${rides} rides`, `${rides} రైడ్‌లు షెడ్యూల్ చేయండి`, `${rides} राइड शेड्यूल करें`), { go: "schreview" }))}`;
});

def("intercity", { g: "Intercity", n: "Intercity", tabs: 0, nav: 1, foot: 1, what: "The trip drawn as a lit road from Vizag to the town, with the car driving it (the top-down render) and, for longer trips, the charging stop marked on the way. Pick a town, one-way or round trip; the fixed fare counts to the new figure.", why: "Answers range anxiety before it's asked, and makes longer trips a simple fixed-fare booking.", fl: "Fare from <code>POST /quotes</code> with <code>type=intercity</code> (₹18/km, round trip +₹600 for waiting). Charging stop from ops' charger list when one-way distance &gt; 150 km (client to confirm). Road: <code>CustomPainter</code> path + the bundled top-down sprite moved along it." }, () => {
  const km = KM[app.idest], rt = app.itrip === "round", dist = rt ? km * 2 : km, fare = icCalc().fare, charge = km > 150;
  const P = "M24 132 C 90 132, 96 52, 170 62 S 270 118, 330 40";
  const hrs = Math.floor(km / 52), mn = Math.round((km / 52 - hrs) * 60 / 5) * 5;
  return `${bar(L("Intercity", "ఇంటర్‌సిటీ", "इंटरसिटी"), { large: true })}
  <div class="content">
    <div class="pad"><div class="ic-road">
      <svg viewBox="0 0 354 170" aria-hidden="true">
        <defs><linearGradient id="icG" x1="0" x2="1"><stop offset="0" stop-color="#5B6CFF"/><stop offset="1" stop-color="#2CC8F5"/></linearGradient></defs>
        <path d="${P}" class="ic-bed"/><path d="${P}" class="ic-lit" pathLength="100"/><path d="${P}" class="ic-dash"/>
        <circle cx="24" cy="132" r="6" class="ic-a"/><circle cx="330" cy="40" r="7" class="ic-b"/>
        ${charge ? `<g class="ic-chg" transform="translate(170 62)"><circle r="15"/><path d="M1.5 -8 L-5 1.5 H0 L-1.5 8 L5 -1.5 H0 Z"/></g>` : ""}
        <g class="ic-car"><image href="${SagaStage.src("top-down")}" x="-20" y="-20" width="40" height="40" transform="rotate(90)"/><animateMotion dur="${charge ? 6 : 4.5}s" repeatCount="indefinite" rotate="auto" path="${P}" keyPoints="0;${charge ? ".5;.5;" : ""}1" keyTimes="0;${charge ? ".42;.62;" : ""}1" calcMode="linear"/></g>
      </svg>
      <span class="ic-l a"><b>Vizag</b><small>${L("7:00 AM", "ఉ. 7:00", "सुबह 7:00")}</small></span>
      <span class="ic-l b"><b>${app.idest}</b><small>${km} km · ~${hrs}h${mn ? " " + mn + "m" : ""}</small></span>
      ${charge ? `<span class="ic-l c">${I("bolt", "sm")}${L("25 min charge", "25 ని. ఛార్జ్", "25 मिनट चार्ज")}</span>` : ""}
    </div></div>
    ${sh(L("Where to?", "ఎక్కడికి?", "कहाँ?"))}
    <div class="ic-dests">${Object.keys(KM).map(k => `<button class="ic-d ${k === app.idest ? "on" : ""}" data-act="idest" data-v="${k}"><b>${k}</b><small>${KM[k]} km · ${S.inr(KM[k] * 18)}</small></button>`).join("")}</div>
    <div class="pad mt16">${seg([["one", L("One way", "ఒక వైపు", "एक तरफ़")], ["round", L("Round trip", "రాను పోను", "आना-जाना")]], app.itrip, "itrip")}</div>
    <div class="group mt16">
      <button class="row" data-act="pickplace" data-s="ic" data-f="from"><span class="lead">${I("pin")}</span><span class="tx"><span class="t2" style="display:block">${L("Pick-up", "పికప్", "पिकअप")}</span><span class="t1" style="display:block">${pl(app.ic.from)}</span></span>${I("chevr", "sm")}</button>
      <button class="row" data-act="pickday"><span class="lead">${I("cal")}</span><span class="tx"><span class="t2" style="display:block">${L("Date", "తేదీ", "तारीख़")}</span><span class="t1" style="display:block">${dlabel(app.ic.day)}</span></span>${I("chevr", "sm")}</button>
      <button class="row" data-act="picktime" data-s="ic" data-f="t"><span class="lead">${I("clock")}</span><span class="tx"><span class="t2" style="display:block">${L("Leave at", "బయలుదేరే సమయం", "निकलने का समय")}</span><span class="t1" style="display:block">${tfmt(app.ic.t)}</span></span>${I("chevr", "sm")}</button>
      <div class="row"><span class="lead">${I("users")}</span><span class="tx"><span class="t1" style="display:block">${L(`${app.ic.riders} riders`, `${app.ic.riders} మంది`, `${app.ic.riders} यात्री`)}</span><span class="t2" style="display:block">${L(`Up to ${RIDERS} · ${V.bags} large bags`, `${RIDERS} వరకు · ${V.bags} బ్యాగులు`, `${RIDERS} तक · ${V.bags} बड़े बैग`)}</span></span><span class="stp"><button data-act="riders" data-v="-1" aria-label="−">${I("minus", "sm")}</button><b class="t-num">${app.ic.riders}</b><button data-act="riders" data-v="1" aria-label="+">${I("plus", "sm")}</button></span></div>
    </div>
    <div class="pad mt12"><div class="ic-chgcard ${charge ? "on" : ""}"><span class="pico">${I(charge ? "bolt" : "battery")}</span><div class="grow"><b>${charge ? L("One 25-minute charging stop, planned", "ఒక 25 నిమిషాల ఛార్జింగ్ స్టాప్, ముందే ప్లాన్", "25 मिनट का एक चार्जिंग स्टॉप, पहले से तय") : L("No charging stop needed", "ఛార్జింగ్ స్టాప్ అవసరం లేదు", "चार्जिंग स्टॉप की ज़रूरत नहीं")}</b><p>${charge ? L("At a fast charger on the way. Your chauffeur handles it; you get a coffee break.", "దారిలో ఫాస్ట్ ఛార్జర్ వద్ద. మీ డ్రైవర్ చూసుకుంటారు; మీకు కాఫీ బ్రేక్.", "रास्ते में फ़ास्ट चार्जर पर। ड्राइवर संभाल लेंगे; आपके लिए चाय-कॉफ़ी ब्रेक।") : L("The car leaves fully charged for this distance.", "ఈ దూరానికి కారు పూర్తి ఛార్జ్‌తో బయలుదేరుతుంది.", "इस दूरी के लिए गाड़ी पूरी चार्ज होकर निकलेगी।")}</p>${rt ? `<p>${L("Round trip: your chauffeur stays with you, up to 8 hours of waiting included.", "రాను పోను: డ్రైవర్ మీతోనే ఉంటారు, 8 గంటల వరకు వేచి ఉండటం కలిపే.", "आना-जाना: ड्राइवर आपके साथ रहेंगे, 8 घंटे तक इंतज़ार शामिल।")}</p>` : ""}</div></div></div>
    <div class="pad mt16"><div class="ic-fare"><span class="grow">${L(`${dist} km · fixed fare`, `${dist} కి.మీ · స్థిర ఛార్జీ`, `${dist} किमी · तय किराया`)}${rt ? `<small>${L("includes ₹600 for waiting", "₹600 వెయిటింగ్ కలిపి", "₹600 इंतज़ार शामिल")}</small>` : ""}</span><b>₹<span class="t-num" data-count="${fare}">${fare.toLocaleString("en-IN")}</span></b></div></div>
  </div>
  ${foot(btn(L("Book intercity ride", "ఇంటర్‌సిటీ రైడ్ బుక్", "इंटरसिटी राइड बुक करें"), { go: "icreview" }))}`;
});

def("vehicle", { g: "Ride", n: "The car", tabs: 0, sb: "light", foot: 1, what: "The SAGA Luxe revealed on a dark expo stage (Cycles renders), with switches for the lights and the showroom light, then a photo-real 360° walk-around, the cabin, seats and bags, and the chauffeur promise.", why: "Every booking is in the same premium car. Showing it builds the value that justifies the fare.", fl: "Static content from CMS (<code>GET /fleet/profile</code>) so the client can update photos and amenities without an app release." }, () => `
  <div class="content" style="padding-top:0">
    <div class="lux">
    <div class="lux-stage"><div class="stg" id="luxstg"></div><div class="ob-shade" style="background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 72%,#000)"></div>
      <div class="lux-top"><span class="eyebrow" style="color:var(--live)">${L("Every SAGA ride", "ప్రతి SAGA రైడ్", "हर SAGA राइड")}</span><h1 class="lux-h mt8">${V.make}<br><em>${V.model}</em></h1><p class="mt8" style="font-size:15px;color:rgba(255,255,255,.7)">${L("7 seats · electric · chauffeur-driven", "7 సీట్లు · ఎలక్ట్రిక్ · డ్రైవర్‌తో", "7 सीट · इलेक्ट्रिक · ड्राइवर के साथ")}</p></div>
      <div class="lux-ctl"><button class="on" data-lux="lights"><i></i>${L("Lights", "లైట్లు", "लाइट")}</button><button class="on" data-lux="top"><i></i>${L("Showroom", "షోరూమ్", "शोरूम")}</button><button data-lux="replay">${I("refresh", "sm")}${L("Replay", "మళ్ళీ", "फिर से")}</button></div>
    </div>
    <div class="pad mt16"><span class="eyebrow">360°</span><h2 class="t-title mt4" style="font-size:32px">${L("Walk around it.", "చుట్టూ చూడండి.", "चारों ओर देखिए।")}</h2></div>
    <div class="lux-spin" data-car3d></div>
    
  </div>
<div class="pad mt16"><div class="lux-specs stagger">
      <div class="lux-spec lg" style="--i:0"><b>${RIDERS}</b><small>${L("riders, plus your chauffeur", "రైడర్లు, డ్రైవర్ కాకుండా", "यात्री, ड्राइवर के अलावा")}</small></div>
      <div class="lux-spec lg" style="--i:1"><b>${V.bags}</b><small>${L("large bags in the boot", "బూట్‌లో పెద్ద బ్యాగులు", "बूट में बड़े बैग")}</small></div>
      <div class="lux-spec lg" style="--i:2"><b>0 g</b><small>${L("tailpipe emissions", "పొగ ఉద్గారాలు", "धुआँ उत्सर्जन")}</small></div>
      <div class="lux-spec lg" style="--i:3"><b>22°</b><small>${L("cabin, cooled before pickup", "పికప్‌కు ముందే చల్లని క్యాబిన్", "पिकअप से पहले ठंडा केबिन")}</small></div>
    </div></div>
    ${sh(L("Inside your ride", "లోపల ఏముంది", "अंदर क्या है"))}
    <div class="pad"><div class="amen">
      <div>${I("snow")}${L("Cabin cooled before pickup", "పికప్‌కు ముందే చల్లని క్యాబిన్", "पिकअप से पहले ठंडा केबिन")}</div>
      <div>${I("drop")}${L("Chilled water on every ride", "ప్రతి రైడ్‌లో చల్లని నీళ్లు", "हर राइड पर ठंडा पानी")}</div>
      <div>${I("device")}${L("Phone charging, USB-C", "ఫోన్ ఛార్జింగ్, USB-C", "फ़ोन चार्जिंग, USB-C")}</div>
      <div>${I("hand")}${L("Help with your bags", "బ్యాగులకు సాయం", "बैग उठाने में मदद")}</div>
      <div>${I("shield")}${L("Child seat on request", "అడిగితే చైల్డ్ సీట్", "माँगने पर चाइल्ड सीट")}</div>
      <div>${I("spark")}${L("Cleaned after every trip", "ప్రతి ప్రయాణం తర్వాత శుభ్రం", "हर सफ़र के बाद सफ़ाई")}</div>
    </div></div>

/* ---------- eco impact + eco points ----------
   Estimates, shown as such: a SAGA Luxe uses ~0.15 kWh/km; a comparable petrol cab burns ~7 L/100 km (≈ 0.163 kg CO₂/km);
   charging on the Indian grid emits ~0.033 kg CO₂/km of that back → ~0.13 kg CO₂ avoided per km. One tree absorbs ~21 kg CO₂ a year.
   10 eco points per kg avoided. */
const ECO = () => { const km = 142 + (app.ecoKm || 0), kg = Math.round(km * 0.13 * 10) / 10; return { km, kg, kwh: Math.round(km * 0.15 * 10) / 10, petrol: Math.round(km * 0.07 * 10) / 10, pts: Math.round(kg * 10), tree: Math.round(kg / 21 * 12 * 10) / 10, trips: 23 + (app.ecoTrips || 0) }; };
const FREE_AT = 200;
const ecoBal = () => Math.max(0, ECO().pts - (app.ecoSpent || 0));
const ecoFill = () => Math.min(1, ecoBal() / FREE_AT);
const WAVE = '<path d="M0 7 Q12.5 0 25 7 T50 7 T75 7 T100 7 T125 7 T150 7 T175 7 T200 7 V14 H0 Z"/>';
const ecoVessel = (cls = "", attrs = "") => { const f = ecoFill(), full = f >= 1; return `<button class="tab-eco ${full ? "full" : ""} ${cls}" style="--lvl:${f.toFixed(3)}" ${attrs}><span class="ev"><span class="eq"><svg class="w2" viewBox="0 0 200 14" preserveAspectRatio="none">${WAVE}</svg><svg class="w1" viewBox="0 0 200 14" preserveAspectRatio="none">${WAVE}</svg><b></b></span><i class="bb b1"></i><i class="bb b2"></i><i class="bb b3"></i></span><span class="eh"></span><span class="ei">${I("leaf")}</span><span class="ep">${full ? L("FREE RIDE", "ఉచిత రైడ్", "मुफ़्त राइड") : Math.round(f * 100) + "%"}</span></button>`; };
const ecoLevel = p => p < 150 ? [L("Seedling", "మొలక", "अंकुर"), 150] : p < 400 ? [L("Sapling", "మొక్క", "पौधा"), 400] : [L("Grove", "తోట", "उपवन"), 1000];

    ${row({ icon: "gift", t: L("Convert 1,240 points to ₹124", "1,240 పాయింట్లు ₹124గా మార్చండి", "1,240 पॉइंट को ₹124 में बदलें"), act: "convert" })}

def("chat", { g: "Ride", n: "Chat with chauffeur", tabs: 0, nav: 1, what: "In-app chat in glass bubbles: Ravi's on the left with his initials, the rider's lit in brand glass on the right. Quick replies float above a composer; each side reads in their own language. Live with the chauffeur app in the suite.", why: "No numbers shared, no language barrier, no shouting across a busy kerb.", fl: "Canned message keys over WebSocket, rendered per reader's locale; free text via a translation API." }, () => `
  ${bar("Ravi Kumar", { actions: hbtn("phone", `data-toast="${esc(L("Calling Ravi (numbers stay private)…", "రవికి కాల్…", "रवि को कॉल…"))}"`, "Call") })}
  <div class="content ch-c">
    <div class="ch-who"><span class="lf-ph">RK</span><span><b>Ravi Kumar</b><small>★ 4.9 · ${V.short} · ${V.plate}</small></span></div>
    <p class="ch-note">${I("globe", "sm")}${L("Messages are translated for each of you", "సందేశాలు ఇద్దరికీ అనువదించబడతాయి", "संदेश दोनों के लिए अनुवाद होते हैं")}</p>
    <div class="msgs ch-msgs">${S.chat.get().map((m, i, a) => `<div class="bub ${m.who === "rider" ? "me" : "them"}" style="--d:${Math.max(0, i - a.length + 4) * 70}ms">${m.who !== "rider" && (i === 0 || a[i - 1].who === "rider") ? `<i class="ch-av">RK</i>` : ""}<span>${S.msg(m.k)}</span><small>${m.at}${m.who === "rider" ? ` · ${L("Read", "చదివారు", "पढ़ा")}` : ""}</small></div>`).join("")}</div>
  </div>
  <div class="ch-dock">
    <div class="ch-quick">${["coming", "atgate", "bags", "cooler"].map(k => `<button class="chip" data-act="send" data-v="${k}">${S.msg(k)}</button>`).join("")}</div>
    <div class="ch-compose"><span class="ch-in">${L("Message Ravi…", "రవికి సందేశం…", "रवि को संदेश…")}</span><button class="ch-mic" data-voice aria-label="Saathi">${I("mic")}</button><button class="ch-send" data-toast="${esc(L("Free text is translated before Ravi reads it", "రవి చదివే ముందే అనువదిస్తాం", "रवि के पढ़ने से पहले अनुवाद होता है"))}" aria-label="${L("Send", "పంపు", "भेजें")}">${I("arrowu")}</button></div>
  </div>`, () => { app.readD = S.chat.get().filter(m => m.who === "driver").length; const c = $("#views .view:last-child .content"); if (c) c.scrollTop = 9999; });

def("language", { g: "Settings", n: "Language", tabs: 0, nav: 1, what: "English, Telugu and Hindi as large glass cards, each written in its own script with a line of the app in that language. Changes the whole app, notifications and Saathi's voice at once.", why: "Vizag riders and many chauffeurs are more comfortable in Telugu; Hindi covers visitors and many airport travellers.", fl: "ARB files per locale; server sends notification templates per user locale. Odia, Tamil, Kannada can be added without code changes." }, () => {
  const sample = { en: "Your chauffeur is 6 min away.", te: "మీ డ్రైవర్ 6 నిమిషాల్లో వస్తారు.", hi: "आपके ड्राइवर 6 मिनट में पहुँचेंगे।" };
  return `
  ${bar(L("Language", "భాష", "भाषा"))}
  <div class="content"><div class="pad">
    <h1 class="t-title serif">${L("Which language <em>feels like home?</em>", "మీకు ఏ భాష <em>సౌకర్యం?</em>", "कौन सी भाषा <em>अपनी लगती है?</em>")}</h1>
    <div class="langs mt16">${S.LANGS.map(l => `<button class="lang lg ln4 ${S.state.lang === l.id ? "on" : ""}" data-setlang="${l.id}" aria-pressed="${S.state.lang === l.id}"><span><b>${l.native}</b><small>${l.name} · “${sample[l.id]}”</small></span><span class="ck">${I("check", "sm")}</span></button>`).join("")}</div>
    <div class="wh-note mt16">${I("mic", "sm")}<span>${L("Saathi listens and replies in the language you choose. Notifications follow it too.", "మీరు ఎంచుకున్న భాషలో సాథీ వింటుంది, జవాబిస్తుంది. నోటిఫికేషన్లు కూడా.", "साथी आपकी चुनी भाषा में सुनता और जवाब देता है। नोटिफ़िकेशन भी।")}</span></div>
  </div>
  ${sh(L("Coming next", "త్వరలో", "जल्द आ रही"))}
  <div class="pad"><div class="ln-next">${[["ଓଡ଼ିଆ", "Odia"], ["தமிழ்", "Tamil"], ["ಕನ್ನಡ", "Kannada"]].map(([n, e]) => `<span><b>${n}</b><small>${e}</small></span>`).join("")}</div></div>
  </div>`;
});

/* Saathi's orb: three soft light lobes turning inside a glass sphere. It breathes while listening and swells when speech arrives. */

def("voicecfg", { g: "Settings", n: "Voice", tabs: 0, nav: 1, what: "Saathi as a luminous orb: three lobes of the brand light turning inside glass, breathing while it listens and swelling with speech. Tap it to talk. Below: phrases to try in the rider's language, then the platform route (Siri on iPhone, Gemini on Android).", why: "Voice makes the app usable for riders who don't type comfortably, in their own language. The orb shows it is listening without words.", fl: "In-app: streaming STT (Sarvam / Google) → intent API → TTS. Orb: a <code>CustomPainter</code> driven by the mic RMS level. iOS: App Intents + App Shortcuts. Android: App Actions now, AppFunctions where Gemini supports it. See brief §10." }, () => {
  const tries = { en: ["Book a ride to RK Beach", "Plan my airport ride for Friday", "Office rides every weekday at 9", "Where is my chauffeur?"], te: ["ఆర్‌కే బీచ్‌కి రైడ్ బుక్ చేయి", "శుక్రవారం ఫ్లైట్‌కి ఎయిర్‌పోర్ట్ రైడ్ ప్లాన్ చేయి", "ప్రతి రోజు 9 గంటలకు ఆఫీస్ రైడ్", "నా డ్రైవర్ ఎక్కడ ఉన్నారు?"], hi: ["आरके बीच के लिए राइड बुक करो", "शुक्रवार की फ़्लाइट के लिए एयरपोर्ट राइड प्लान करो", "हर दिन 9 बजे ऑफिस की राइड", "मेरा ड्राइवर कहाँ है?"] }[S.state.lang];
  const sys = ios()
    ? [["Hey Siri, book a SAGA", L("Opens a booking to your usual place", "మీ సాధారణ స్థలానికి బుకింగ్", "आपकी आम जगह के लिए बुकिंग")], ["Hey Siri, where's my SAGA?", L("Reads your chauffeur's ETA", "డ్రైవర్ ETA చదువుతుంది", "ड्राइवर का ETA बताता है")], ["Hey Siri, SAGA to the airport", L("Starts the airport flow", "ఎయిర్‌పోర్ట్ బుకింగ్ ప్రారంభం", "एयरपोर्ट बुकिंग शुरू")]]
    : [["Hey Google, book a SAGA", L("Gemini opens SAGA with the booking ready", "జెమినీ బుకింగ్‌తో SAGA తెరుస్తుంది", "Gemini बुकिंग के साथ SAGA खोलता है")], ["Hey Google, where's my SAGA?", L("Reads your chauffeur's ETA", "డ్రైవర్ ETA చదువుతుంది", "ड्राइवर का ETA बताता है")], ["Hey Google, SAGA to the airport", L("Starts the airport flow", "ఎయిర్‌పోర్ట్ బుకింగ్ ప్రారంభం", "एयरपोर्ट बुकिंग शुरू")]];
  return `${bar(L("Voice", "వాయిస్", "आवाज़"))}
  <div class="content">
    <div class="vc-hero">
      <button class="vc-orb" data-voice aria-label="${L("Talk to Saathi", "సాథీతో మాట్లాడండి", "साथी से बात करें")}">${orb("idle")}</button>
      <h1 class="serif">Saathi</h1>
      <p>${L("Ask in English, Telugu or Hindi. Tap the light.", "ఇంగ్లీష్, తెలుగు, హిందీలో అడగండి. వెలుగును నొక్కండి.", "अंग्रेज़ी, तेलुगु या हिंदी में पूछें। रोशनी दबाएँ।")}</p>
    </div>
    ${sh(L("Try saying", "ఇలా చెప్పండి", "ऐसे बोलें"))}
    <div class="pad vc-tries">${tries.map((t, i) => `<button data-say="${esc(t)}" style="--d:${i * 60}ms">${I("mic", "sm")}<span>“${t}”</span></button>`).join("")}</div>
    ${sh(ios() ? "Siri" : "Gemini")}
    <div class="group">${sys.map(([a, b]) => row({ icon: "spark", lc: "ink", t: `“${a}”`, s: b, chev: false, trail: `<span class="pill ok">${L("Ready", "సిద్ధం", "तैयार")}</span>` })).join("")}</div>
    <div class="group mt16"><div class="row"><span class="lead">${I("quiet")}</span><span class="tx"><span class="t1" style="display:block">${L("Read updates aloud", "అప్‌డేట్‌లు గట్టిగా చదువు", "अपडेट बोलकर सुनाएँ")}</span><span class="t2" style="display:block">${L("Chauffeur arriving, pickup moved", "డ్రైవర్ వస్తున్నారు, పికప్ మారింది", "ड्राइवर आ रहा है, पिकअप बदला")}</span></span>${tgl(app.read, 'data-act="read"')}</div></div>
  </div>`;
});

def("travel", { g: "Settings", n: "Find my flights", tabs: 0, nav: 1, what: "Set up once: a personal SAGA travel address and a one-minute Gmail forwarding filter, shown as three lit steps with a glass preview of the filter itself. Airline emails then reach SAGA on their own. The two other ways in (scan the ticket, pick from the VTZ board) sit below, plus optional auto-booking and a plain privacy promise.", why: "Neither phone lets a ride app read email directly. A forwarding filter needs no Gmail permission at all, works for every airline and travel site, and still makes detection automatic.", fl: "Per-rider inbound address on the <code>trips.</code> subdomain (inbound mail webhook → flight parser). The rider adds one Gmail filter; no Gmail API scope. Non-flight mail is dropped and deleted. See brief §4." }, () => {

    <div class="pad mt16"><div class="tv-steps">

      ${step(3, L("Forward to your SAGA address", "SAGA చిరునామాకు ఫార్వర్డ్ చేయండి", "SAGA पते पर फ़ॉरवर्ड करें"), `<p>${L("Tick “Forward it to” and choose your SAGA address.", "“Forward it to” టిక్ చేసి మీ SAGA చిరునామా ఎంచుకోండి.", "“Forward it to” चुनें और अपना SAGA पता दें।")}</p>`)}
    </div></div>

  if (d.t === "got") { app.driverLive = true; timers.forEach(clearTimeout); timers = []; toast(L("Ravi's app received your booking", "మీ బుకింగ్ రవి యాప్‌కు చేరింది", "आपकी बुकिंग रवि के ऐप तक पहुँची"), L("Matched", "జత అయింది", "मैच हुआ")); if (cur === "finding") timers.push(setTimeout(() => { if (cur === "finding") go("assigned", { replace: true }); }, 12000)); }
  if (d.t === "ack") { app.stage = 2; toast(L("Ravi is on the way · 6 min", "రవి వస్తున్నారు · 6 నిమి", "रवि आ रहे हैं · 6 मिनट"), L("Chauffeur assigned", "డ్రైవర్ కేటాయించారు", "ड्राइवर तय")); if (["finding", "nocars"].includes(cur)) go("assigned", { replace: true }); }
  if (d.t === "arrived") { app.stage = 3; toast(L("Ravi has arrived at Gate 2. Free waiting for 10 min.", "రవి గేట్ 2 వద్దకు వచ్చారు. 10 నిమి ఉచిత వెయిటింగ్.", "रवि गेट 2 पर पहुँच गए। 10 मिनट मुफ़्त इंतज़ार।"), L("Your SAGA is here", "మీ SAGA వచ్చింది", "आपकी SAGA आ गई")); if (cur === "assigned") rerender(); }
  if (d.t === "start") { app.stage = 4; toast(L("Code accepted. Enjoy the ride.", "కోడ్ సరైనది. ప్రయాణం ఆనందించండి.", "कोड सही। सफ़र का आनंद लें।"), L("Ride started", "రైడ్ మొదలైంది", "राइड शुरू")); go("onride"); }
  if (d.t === "end") go("arrived");
  if (d.t === "msg") { toast(S.msg(d.k), "Ravi Kumar"); if (["chat", "assigned", "onride"].includes(cur)) rerender(); }
});
/* suite mirroring: a mirrored frame is a passive follower (no auto-advancing timers, no echo back) until someone touches it */
window.addEventListener("message", e => { const d = e.data || {}; if (d.saga === "go" && SC[d.id]) { app.follower = !!d.mirror; if (d.id !== cur) go(d.id, { tab: !!SC[d.id].tab, instant: d.instant, suite: 1 }); } });
document.addEventListener("pointerdown", e => { if (e.isTrusted && app.follower) app.follower = false; }, true);
S.onChange(() => { S.apply(); rerender(); if ($("#voice").classList.contains("on")) voiceUI($(".vtext", vEl)?.textContent || "", ""); });

/* ---------- side panel ---------- */
function syncPanel() {
  if (EMBED || BARE) return;
  const p = $("#panel"), sc = SC[cur];
  const groups = {}; Object.values(SC).forEach(s => (groups[s.g] = groups[s.g] || []).push(s));
  p.innerHTML = `<h1>${S.logo()}<span style="font-weight:600;color:var(--fg2)">Rider · v2</span></h1>
    <div class="k">Platform</div><div class="sw">${["ios", "android"].map(o => `<button class="${S.state.os === o ? "on" : ""}" data-panel="os:${o}">${o === "ios" ? "iPhone" : "Android"}</button>`).join("")}</div>
    <div class="k">Appearance</div><div class="sw">${["light", "dark", "system"].map(o => `<button class="${S.state.theme === o ? "on" : ""}" data-panel="theme:${o}">${o[0].toUpperCase() + o.slice(1)}</button>`).join("")}</div>
    <div class="k">Language</div><div class="sw">${S.LANGS.map(l => `<button class="${S.state.lang === l.id ? "on" : ""}" data-panel="lang:${l.id}">${l.native}</button>`).join("")}</div>
    <div class="notes"><h3>${sc.n}</h3><dl><dt>What it does</dt><dd>${sc.what}</dd><dt>Why</dt><dd>${sc.why}</dd><dt>Flutter build</dt><dd>${sc.fl}</dd></dl></div>
    <div class="k">Screens</div>${Object.entries(groups).map(([g, list]) => `<div class="grp">${g}</div>${list.map(s => `<button class="sl ${s.id === cur ? "on" : ""}" data-screen="${s.id}">${s.n}</button>`).join("")}`).join("")}
    <div class="k">Other apps</div><a class="out" href="index.html">Suite: iPhone and Android side by side →</a><a class="out" href="driver.html">Driver app →</a><a class="out" href="hotel.html">Hotel partner app →</a><a class="out" href="ops.html">Ops dashboard →</a><a class="out" href="screens.html">Screen map →</a><a class="out" href="brief.html">Client brief →</a>`;
}

/* ---------- fit to window ---------- */
const dev = $("#device");
dev.classList.add(BARE ? "bare" : S.state.os);
function fit() {
  const area = $("#stagearea"), W = area.clientWidth, H = area.clientHeight, dw = dev.offsetWidth, dh = dev.offsetHeight;
  const pad = EMBED || BARE ? 0 : 40, k = Math.min((W - pad) / dw, (H - pad) / dh, BARE ? 10 : 1);
  $("#fit").style.transform = `scale(${k})`; $("#fit").style.width = dw + "px"; $("#fit").style.height = dh + "px";
}
addEventListener("resize", fit); fit();

const start = S.qs.get("screen") || location.hash.slice(1) || "welcome";
/* ---------- v5.3 interaction layer: sliding selections, press and select feedback (transform/opacity only) ---------- */
(() => {
  const segFrom = {}, segKey = s => (s.querySelector("[data-act]") || {}).dataset?.act || "seg";
  // remember where the selection was before a tap rebuilds the view
  document.addEventListener("click", e => {
    const b = e.target.closest(".seg button"); if (!b) return;
    const sg = b.closest(".seg"), on = sg.querySelector("button.on"); if (on) segFrom[segKey(sg)] = { x: on.offsetLeft, w: on.offsetWidth };
  }, true);
  const placeSeg = sg => {
    const on = sg.querySelector("button.on"); if (!on) return;
    let ind = sg.querySelector(":scope > .seg-ind"); if (!ind) { ind = document.createElement("i"); ind.className = "seg-ind"; sg.prepend(ind); }
    const x = on.offsetLeft, w = on.offsetWidth, from = segFrom[segKey(sg)];
    ind.style.width = w + "px"; ind.style.height = on.offsetHeight + "px"; ind.style.top = on.offsetTop + "px";
    if (from && (from.x !== x)) {
      ind.style.transition = "none"; ind.style.transform = `translate3d(${from.x}px,0,0) scaleX(${from.w / w})`;
      void ind.offsetWidth; ind.style.transition = ""; ind.style.transform = `translate3d(${x}px,0,0)`;
    } else ind.style.transform = `translate3d(${x}px,0,0)`;
    delete segFrom[segKey(sg)];
    sg.classList.add("has-ind");
  };
  // the dock: one white key glides to the active tab
  let tabFrom = null;
  const placeTab = () => {
    const bar = document.getElementById("tabbar"); if (!bar || bar.classList.contains("hide")) return;
    const on = bar.querySelector(".tab.on"); let ind = bar.querySelector(".tab-ind");
    if (!on) { if (ind) ind.style.opacity = 0; return; }
    if (!ind) { ind = document.createElement("i"); ind.className = "tab-ind"; bar.prepend(ind); }
    const x = on.offsetLeft, y = on.offsetTop; ind.style.opacity = 1; ind.style.width = on.offsetWidth + "px"; ind.style.height = on.offsetHeight + "px"; ind.style.top = y + "px";
    if (tabFrom != null && tabFrom !== x) { ind.style.transition = "none"; ind.style.transform = `translate3d(${tabFrom}px,0,0)`; void ind.offsetWidth; ind.style.transition = ""; }
    ind.style.transform = `translate3d(${x}px,0,0)`; tabFrom = x; bar.classList.add("has-ind");
  };
  const sweep = () => { document.querySelectorAll("#views .view:last-child .seg").forEach(placeSeg); placeTab(); };
  new MutationObserver(() => setTimeout(sweep, 0)).observe(document.getElementById("views"), { childList: true });
  const tb = document.getElementById("tabbar"); if (tb) new MutationObserver(() => setTimeout(placeTab, 0)).observe(tb, { childList: true });
  // press and select: cards bloom a light ring, buttons dip and catch a sheen
  const CARDS = ".pl-card,.hm-tile,.hm-strip,.tr-past,.tr-card,.otk,.ic-d,.eco-r,.wh-tile,.row,.nc-perk,.eco-t,.wl-card,.ac-theme button,.lang,.dv-job,.qk,.board .bd-row,.chip,.wk button,.or-ctl,.wl-top-ups button,.vc-tries button";
  document.addEventListener("pointerdown", e => {
    const c = e.target.closest(CARDS + ",.btn,.search2,.tab,.tab-eco,.s-now,.s-mic"); if (!c) return;
    c.classList.remove("tapped"); void c.offsetWidth; c.classList.add("tapped");
    setTimeout(() => c.classList.remove("tapped"), 700);
  }, { passive: true });
  setTimeout(sweep, 0);
})();

go(SC[start] ? start : "welcome", { instant: true, tab: !!(SC[start] || SC.welcome).tab });
if (S.qs.has("voice")) setTimeout(BARE ? () => voiceUI("", "", true) : openVoice, 300);
})();
</script>
