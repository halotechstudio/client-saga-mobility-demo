<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAGA Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<style>
body{background:#E4E4E8;color:var(--fg);overflow:hidden}
[data-theme=dark] body{background:#0B0B0D}
body.embed,body.bare{background:transparent}
.shell{display:flex;height:100vh}
.panel{width:330px;flex:none;overflow-y:auto;padding:24px 20px 40px;border-right:1px solid var(--hair);background:var(--bg);font-family:"Inter",system-ui,sans-serif;scrollbar-width:thin}
.embed .panel,.bare .panel{display:none}
.panel h1{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:22px 0 8px}
.panel .sw{display:flex;gap:4px;padding:3px;background:var(--surface2);border-radius:12px}
.panel .sw button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2)}
.panel .sw button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.panel .grp{font-size:13px;font-weight:600;color:var(--fg2);margin:16px 0 4px}
.panel .sl{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--fg)}
.panel .sl:hover{background:var(--surface2)}
.panel .sl.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.notes{margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);font-size:14.5px;line-height:1.5}
.notes h3{font-size:16px;margin-bottom:8px}
.notes dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-top:10px}
.notes code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.panel a.out{display:block;margin-top:8px;font-size:14px;color:var(--accent-ink);font-weight:600;text-decoration:none}
.stagearea{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit{transform-origin:center center;flex:none}

/* ---- rider specific ---- */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 0;height:60px}
.home-head .r{display:flex;gap:10px;align-items:center}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--accent-soft);color:var(--on-accent-soft);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.avatar.xl{width:64px;height:64px;border-radius:32px;font-size:22px}
.bellwrap{position:relative}.bellwrap i{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--danger);border:2px solid var(--bg)}
.search{display:flex;align-items:center;gap:12px;width:calc(100% - 40px);margin:14px 20px 0;height:62px;border-radius:31px;background:var(--surface);padding:0 8px 0 20px;font-size:18px;font-weight:600;box-shadow:var(--shadow);color:var(--fg)}
.search .ph{flex:1;text-align:left}
.search .mic{width:48px;height:48px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
[data-os=android] .search{height:64px;border-radius:32px;background:var(--surface2);box-shadow:none;font-weight:400;padding-left:18px}
[data-os=android] .search .mic{background:none;color:var(--fg)}
.places{margin-top:14px}
.greet{padding:14px 20px 0}
.greet .t-label{font-weight:500}
.air{display:block;width:calc(100% - 40px);margin:16px 20px 0;padding:20px;border-radius:28px;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.air .plane{position:absolute;right:-18px;top:18px;width:150px;height:150px;opacity:.08;color:#fff}
.air .plane .ic{width:150px;height:150px;stroke-width:1}
.pnrm{display:flex;gap:6px;align-items:center}
.pnrm span{width:38px;height:48px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-family:var(--mono);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:18px}
.pnrm .go{margin-left:auto;width:48px;height:48px;border-radius:24px;background:#fff;color:#0B0C0F;display:flex;align-items:center;justify-content:center;border:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;margin-top:12px}
.tile{background:var(--surface);border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:140px;color:var(--fg)}
.tile .tic{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.tile b{font-size:18px;font-weight:600}.tile span{font-size:14.5px;color:var(--fg2);line-height:1.35}
[data-os=android] .tile{border-radius:28px;background:var(--surface2)}
[data-os=android] .tile .tic{border-radius:23px}
[data-os=android] .tile b{font-weight:500}
.sugg{margin:16px 20px 0;border:1px solid var(--hair)}
.sugg .sq{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.showcase{margin:0 20px;cursor:pointer;position:relative}
.showcase .sc-t{padding:20px 20px 0}
.showcase .sc-car{margin:4px 0 -42px;padding:0 6px}
.showcase .specs{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 20px;position:relative}
.nearby{margin:0 20px;cursor:pointer}
.nearby .nb-map{height:150px;position:relative}
.nearby .nb-tx{padding:14px 18px}
.dotlive{width:10px;height:10px;border-radius:5px;background:var(--success);box-shadow:0 0 0 5px color-mix(in srgb,var(--success) 22%,transparent);flex:none;margin:0 4px}
.upc{margin:0 20px}
.wl{position:absolute;inset:0;display:flex;flex-direction:column;color:#F4F4F6}
.wl-top{padding:70px 24px 0;display:flex;justify-content:center}
.wl-top .wordmark{font-size:20px;color:#fff}.wl-top .logo-img{height:30px}
.wl-car{margin:34px -40px 0 -10px}
.wl-body{margin-top:auto;padding:0 24px 40px}
.wl-body .t-body{color:#A9ABB3}
.wl-langs{display:flex;justify-content:center;gap:6px}
.wl-langs button{height:44px;padding:0 16px;border-radius:22px;color:#A9ABB3;font-size:15px;font-weight:600}
.wl-langs button.on{background:rgba(255,255,255,.12);color:#fff}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:24px 20px 36px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 26%)}
.has-foot .content{padding-bottom:190px}
.vline{width:1px;height:26px;background:var(--hair)}
.permrow{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.permrow+.permrow{border-top:1px solid var(--hair)}
[data-os=android] .permrow+.permrow{border-top:0;margin-top:3px}
.permrow .t1{font-size:17px;font-weight:600}.permrow .t2{font-size:15px;color:var(--fg2);margin-top:3px;line-height:1.4}
.permcard{margin:0 16px;background:var(--surface);border-radius:26px;overflow:hidden}
[data-os=android] .permcard{background:none;display:grid;gap:3px;border-radius:0}
[data-os=android] .permcard .permrow{background:var(--surface);border-radius:6px}
[data-os=android] .permcard .permrow:first-child{border-radius:24px 24px 6px 6px}[data-os=android] .permcard .permrow:last-child{border-radius:6px 6px 24px 24px}
.pico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
[data-os=android] .pico{border-radius:20px}
/* map screens */
.mapbtns{position:absolute;z-index:31;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;top:62px}
[data-os=android] .mapbtns{top:52px}
[data-os=android] .mapbtns .gbtn{background:var(--surface);border:0;backdrop-filter:none;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:16px}
.mapwrap.h55{bottom:auto;height:56%}
.optcar{margin:-10px auto -14px;max-width:300px}
.price{text-align:right}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.lineitem{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:7px 0}
.lineitem.total{font-size:18px;font-weight:700;border-top:1px solid var(--hair);margin-top:6px;padding-top:12px}
.progress{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.progress.ind i{width:40%;animation:ind 1.4s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.drv{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface2)}
[data-os=android] .drv{background:var(--surface2)}
.drv .ph{width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,#C9A57A,#7B5A3A);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;position:relative}
.drv .ph b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--fg);font-size:12px;padding:1px 6px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.plate{font-family:var(--mono);font-size:14px;font-weight:500;padding:5px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--hair);white-space:nowrap}
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox span{flex:1;height:64px;border-radius:18px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;font-weight:500}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--fg)}
.act span.c{width:56px;height:56px;border-radius:28px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
[data-os=android] .act span.c{border-radius:18px;background:var(--accent-soft);color:var(--on-accent-soft)}
.act.sos span.c{color:var(--danger)}
.toppill{position:absolute;z-index:31;left:50%;transform:translateX(-50%);top:62px;height:48px;padding:0 18px;border-radius:24px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:0 4px 14px rgba(0,0,0,.1)}
[data-os=android] .toppill{top:54px;background:var(--surface);border:0;box-shadow:0 2px 8px rgba(0,0,0,.16)}
.demo{display:block;margin:14px auto 0;font-size:14px;font-weight:600;color:var(--fg2);border:1.5px dashed var(--hair);border-radius:12px;padding:8px 14px}
.seal{width:96px;height:96px;border-radius:48px;margin:0 auto;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px color-mix(in srgb,var(--accent) 40%,transparent)}
.seal .ic{width:48px;height:48px;stroke-width:2.4}
.seal path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stars{display:flex;justify-content:center;gap:8px}
.stars button{width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.stars button .ic{width:36px;height:36px}
.stars button.on{color:#E8A317}.stars button.on .ic{fill:#E8A317}
.ticket{background:var(--surface);border-radius:26px;position:relative;overflow:hidden}
.ticket .tk-top{padding:18px 20px}
.ticket .tk-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.ticket .iata{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1}
.ticket .tk-line{flex:1;display:flex;align-items:center;gap:6px;color:var(--fg3)}
.ticket .tk-line i{flex:1;border-top:1.5px dashed var(--fg3)}
.ticket .tk-cut{position:relative;height:0;border-top:1.5px dashed var(--hair);margin:0 20px}
.ticket .tk-cut::before,.ticket .tk-cut::after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:13px;background:var(--bg)}
.ticket .tk-cut::before{left:-33px}.ticket .tk-cut::after{right:-33px}
.ticket .tk-bot{padding:14px 20px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ticket .tk-bot b{display:block;font-size:16px;margin-top:2px}
.tl{padding:6px 0}
.tli{display:grid;grid-template-columns:72px 18px 1fr;gap:10px;position:relative;padding:9px 0}
.tli time{font-size:17px;font-weight:700;font-feature-settings:"tnum" 1;text-align:right}
.tli .d{width:12px;height:12px;border-radius:6px;background:var(--surface3);margin:5px auto 0;position:relative;z-index:1}
.tli.on .d{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tli:not(:last-child)::after{content:"";position:absolute;left:calc(72px + 10px + 8px);top:27px;bottom:-9px;width:2px;background:var(--surface3)}
.tli .x b{font-size:16.5px;display:block}.tli .x span{font-size:14.5px;color:var(--fg2)}
.tli.mut time,.tli.mut b{color:var(--fg2);font-weight:500}
.days{display:flex;gap:6px;justify-content:space-between}
.days button{width:46px;height:46px;border-radius:23px;background:var(--surface);font-weight:600;font-size:15px;color:var(--fg)}
.days button.on{background:var(--accent);color:var(--on-accent)}
[data-os=android] .days button{background:var(--surface2)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .dn{font-size:13px;font-weight:600;color:var(--fg2);height:26px}
.cd{height:42px;display:flex;align-items:center;justify-content:center;border-radius:21px;font-size:15.5px;position:relative;font-feature-settings:"tnum" 1}
.cd.past{color:var(--fg3)}
.cd.on{background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cd.skip{color:var(--fg3);text-decoration:line-through}
.cd.flight{background:var(--fg);color:var(--bg);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--fg2);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-1px;margin-right:6px}
.dests{display:flex;flex-wrap:wrap;gap:8px}
.vhero{position:relative;padding:110px 0 0;min-height:440px}
.vhero .vcar{margin:20px -30px -60px -10px}
.vhero .vt{padding:0 24px}
.spec4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spec4 div{background:var(--surface);border-radius:20px;padding:14px 8px;text-align:center;font-size:14px;color:var(--fg2)}
.spec4 b{display:block;font-size:18px;color:var(--fg);margin-top:6px}
.spec4 .ic{color:var(--accent-ink)}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amen div{background:var(--surface);border-radius:20px;padding:16px;font-size:15.5px;line-height:1.35;display:flex;flex-direction:column;gap:10px}
.amen .ic{color:var(--accent-ink)}
[data-os=android] .amen div,[data-os=android] .spec4 div{background:var(--surface2)}
.seatcard{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.offer{display:flex;gap:14px;padding:18px;border-radius:26px;background:var(--surface);align-items:flex-start}
.offer+.offer{margin-top:10px}
.offer .oi{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.offer .code{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:14px;padding:5px 10px;border-radius:8px;border:1.5px dashed var(--accent-ink);color:var(--accent-ink)}
[data-os=android] .offer{border-radius:28px;background:var(--surface2)}
.pts{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1}
.notif{display:flex;gap:14px;padding:16px 18px;position:relative}
.notif+.notif{border-top:1px solid var(--hair)}
.notif .ni{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.notif.new .ni{background:var(--accent);color:var(--on-accent)}
.notif b{font-size:16.5px;display:block}.notif p{font-size:15px;color:var(--fg2);margin-top:2px;line-height:1.4}.notif time{font-size:13.5px;color:var(--fg2);margin-top:4px;display:block}
[data-os=android] .notif .ni{border-radius:22px}
.lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 10%,#2B3448 0%,#12151C 45%,#07080A 100%);color:#fff;overflow:hidden}
.lock .lk-date{text-align:center;padding-top:82px;font-size:20px;font-weight:600;opacity:.9}
.lock .lk-time{text-align:center;font-size:96px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:4px}
[data-os=android] .lock .lk-date{text-align:left;padding:74px 28px 0;font-size:17px}
[data-os=android] .lock .lk-time{text-align:left;padding:0 24px;font-size:104px;font-weight:400;line-height:.95}
.lk-stack{position:absolute;left:12px;right:12px;bottom:110px;display:flex;flex-direction:column;gap:8px}
.la{border-radius:26px;padding:16px 18px;background:rgba(30,32,38,.72);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.la .la-h{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#C9CBD2}
.la .la-h .wordmark{font-size:13px;color:#fff}.la .la-h .logo-img{height:16px}
.la .la-big{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.la .trk{display:flex;align-items:center;gap:8px;margin-top:12px}
.la .trk .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);position:relative}
.la .trk .bar i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:3px;background:var(--accent)}
.la .trk .bar b{position:absolute;left:62%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:13px;background:#fff;color:#0B0C0F;display:flex;align-items:center;justify-content:center}
.la .trk .bar b .ic{width:16px;height:16px}
.nt{border-radius:22px;padding:13px 16px;background:rgba(40,42,48,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);display:flex;gap:12px}
.nt .ap{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:15px}
.nt b{font-size:15.5px;display:block}.nt p{font-size:15px;color:#D5D7DD;line-height:1.35}.nt time{font-size:13px;color:#9EA1A9;float:right}
[data-os=android] .la,[data-os=android] .nt{border-radius:28px;background:rgba(36,38,44,.9);backdrop-filter:none}
[data-os=android] .nt .ap{border-radius:19px}
.lk-hint{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:14px;color:#9EA1A9}
/* voice */
@property --va{syntax:"<angle>";initial-value:0deg;inherits:false}
.voice{position:absolute;inset:0;z-index:85;pointer-events:none;opacity:0;transition:opacity .3s}
.voice.on{pointer-events:auto;opacity:1}
.voice .vscrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.voice .edge{position:absolute;inset:0;padding:5px;border-radius:inherit;background:conic-gradient(from var(--va),var(--accent),var(--accent-soft),#FFFFFF,var(--accent),var(--accent-soft),var(--accent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(5px);opacity:.9;animation:va 4s linear infinite}
@keyframes va{to{--va:360deg}}
[data-os=android] .voice .edge{display:none}
.vpanel{position:absolute;left:10px;right:10px;bottom:10px;border-radius:46px;padding:22px 22px 30px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateY(30px);transition:transform .45s cubic-bezier(.2,1.1,.3,1)}
[data-theme=light] .vpanel{background:rgba(255,255,255,.86)}
.voice.on .vpanel{transform:none}
[data-os=android] .vpanel{left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:var(--surface);border:0;backdrop-filter:none;padding:22px 20px 44px}
[data-os=android] .vpanel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,var(--accent),var(--accent-soft),var(--accent))}
.vhead{display:flex;align-items:center;gap:10px}
.vhead .who{font-size:15px;font-weight:700;color:var(--accent-ink)}
.wave{display:flex;gap:4px;align-items:center;height:28px;margin-left:auto}
.wave i{width:5px;height:8px;border-radius:3px;background:var(--accent);transition:height .2s}
.voice.listening .wave i{animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s!important}.wave i:nth-child(3){animation-delay:.24s!important}.wave i:nth-child(4){animation-delay:.36s!important}.wave i:nth-child(5){animation-delay:.48s!important}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}
.vtext{font-size:25px;line-height:1.3;font-weight:600;margin-top:16px;min-height:66px;letter-spacing:-.01em}
.vtext.dim{color:var(--fg2)}
.vreply{font-size:17px;line-height:1.45;color:var(--fg2);margin-top:6px}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.vchips button{height:44px;padding:0 14px;border-radius:22px;background:var(--surface2);font-size:15px;font-weight:500;color:var(--fg)}
[data-theme=light][data-os=ios] .vchips button{background:rgba(0,0,0,.06)}
.vfoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.vmic{width:64px;height:64px;border-radius:32px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.voice.listening .vmic{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 18%,transparent)}}
.vnote{font-size:13.5px;color:var(--fg2);max-width:230px;line-height:1.35}
</style>
</head>
<body>
<div class="shell">
  <aside class="panel" id="panel"></aside>
  <main class="stagearea" id="stagearea">
    <div class="fit" id="fit">
      <div class="device" id="device">
        <div class="screen" id="screen">
          <div class="statusbar" id="sb"></div>
          <div class="views" id="views"></div>
          <div class="sbfade" id="sbfade"></div>
          <nav class="tabbar hide" id="tabbar"></nav>
          <button class="tab-voice hide" id="tabvoice" data-voice aria-label="Saathi voice"></button>
          <button class="fab hide" id="fab" data-voice aria-label="Saathi voice"></button>
          <div class="overlay" id="overlay"><div class="scrim" data-close></div><div class="modal" id="modal"></div></div>
          <div class="voice" id="voice"></div>
          <div class="toast" id="toast"></div>
          <div class="homebar"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="core.js"></script>
<script>
(function () {
const S = SAGA, L = S.L, I = S.icon, $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const ios = () => S.state.os === "ios";
const EMBED = S.qs.has("embed"), BARE = S.qs.has("bare");
document.body.classList.toggle("embed", EMBED); document.body.classList.toggle("bare", BARE);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const V = S.VEHICLE, RIDERS = S.riders();

/* demo state */
const app = {
  dest: "Dwaraka Nagar", dir: "dep", shift: 0, booked: false, series: false, inter: false, sugg: true,
  days: [1, 2, 3, 4, 5], ret: true, same: true, idest: "Araku Valley", itrip: "one", rating: 0, tripSeg: "up", skips: [],
  perms: { loc: true, notif: true, cal: true }, travel: { cal: true, mail: true }, read: true, noCars: false
};
const FARE = 287, AIRFARE = 1140;
const KM = { "Vizianagaram": 60, "Srikakulam": 110, "Araku Valley": 115, "Kakinada": 160, "Rajahmundry": 195 };
const hhmm = (h, m) => { const t = h * 60 + m; let H = Math.floor(((t % 1440) + 1440) % 1440 / 60), M = ((t % 60) + 60) % 60; const ap = H >= 12 ? "PM" : "AM"; const h12 = H % 12 || 12; return `${h12}:${String(M).padStart(2, "0")} ${ap}`; };
const greet = () => { const h = new Date().getHours(); return h < 12 ? L("Good morning", "శుభోదయం", "सुप्रभात") : h < 17 ? L("Good afternoon", "శుభ మధ్యాహ్నం", "नमस्ते") : L("Good evening", "శుభ సాయంత్రం", "शुभ संध्या"); };

/* ---------- components ---------- */
const btn = (label, o = {}) => `<button class="btn ${o.kind || "btn-primary"} ${o.block === false ? "" : "block"} ${o.cls || ""}" ${o.go ? `data-go="${o.go}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""} ${o.attr || ""}>${o.icon ? I(o.icon) : ""}<span>${label}</span></button>`;
const hbtn = (icon, attr, label = "") => ios() ? `<button class="gbtn" ${attr} aria-label="${esc(label)}">${I(icon)}</button>` : `<button class="ibtn" ${attr} aria-label="${esc(label)}">${I(icon)}</button>`;
function bar(title, o = {}) {
  const back = o.back !== false, bl = L("Back", "వెనుకకు", "वापस");
  if (ios()) return `<header class="nav"><div class="nav-row">${back ? `<button class="gbtn" data-back aria-label="${bl}">${I("chevl")}</button>` : "<span></span>"}<div class="nav-title">${o.large ? "" : title}</div><div class="nav-actions">${o.actions || ""}</div></div>${o.large ? `<h1 class="large-title">${title}</h1>` : ""}</header>`;
  return `<header class="topbar"><div class="tb-row">${back ? `<button class="ibtn" data-back aria-label="${bl}">${I("arrowl")}</button>` : `<span style="width:10px"></span>`}<div class="tb-title">${o.large ? "" : title}</div><div class="tb-actions">${o.actions || ""}</div></div>${o.large ? `<h1 class="tb-headline">${title}</h1>` : ""}</header>`;
}
const row = (o) => `<button class="row" ${o.go ? `data-go="${o.go}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.toast ? `data-toast="${esc(o.toast)}"` : ""} ${o.attr || ""}>${o.icon ? `<span class="lead ${o.lc || ""}">${I(o.icon)}</span>` : ""}<span class="tx"><span class="t1" style="display:block">${o.t}</span>${o.s ? `<span class="t2" style="display:block">${o.s}</span>` : ""}</span><span class="trail">${o.trail || ""}${o.chev === false ? "" : I(ios() ? "chevr" : "chevr")}</span></button>`;
const tgl = (on, attr = "") => `<span class="tgl ${on ? "on" : ""}" role="switch" aria-checked="${on}" ${attr}></span>`;
const seg = (opts, cur, act) => `<div class="seg" role="tablist">${opts.map(([v, l]) => `<button class="${v === cur ? "on" : ""}" data-act="${act}" data-v="${v}">${!ios() && v === cur ? I("check", "sm") : ""}${l}</button>`).join("")}</div>`;
const pill = (icon, t, k = "") => `<span class="pill ${k}">${icon ? I(icon) : ""}${t}</span>`;
const sh = (t, link) => `<div class="sh"><h2>${t}</h2>${link || ""}</div>`;
const foot = (inner) => `<div class="foot">${inner}</div>`;
const mapBtns = (right = "") => `<div class="mapbtns">${hbtn(ios() ? "chevl" : "arrowl", "data-back", "Back")}${right}</div>`;

/* ---------- screens ---------- */
const SC = {};
const def = (id, meta, render, mount) => (SC[id] = Object.assign({ id, render, mount }, meta));

def("welcome", { g: "Start", n: "Welcome", tabs: 0, sb: "light", what: "Full-bleed dark stage with the SUV, one promise, one button. Language can be chosen before anything else.", why: "Sets the premium tone in the first second and lets Telugu and Hindi speakers switch before reading a word.", fl: "Route <code>/welcome</code>. Logo is the client's SVG asset; colours from <code>SagaTokens</code>." }, () => `
  <div class="view-in stage wl">
    <div class="wl-top">${S.logo()}</div>
    <div class="wl-car">${S.car()}</div>
    <div class="wl-body">
      ${pill("bolt", L("All-electric · chauffeur-driven", "పూర్తి ఎలక్ట్రిక్ · మా డ్రైవర్‌తో", "पूरी तरह इलेक्ट्रिक · हमारे ड्राइवर के साथ"), "dark")}
      <h1 class="t-hero mt16">${L("Arrive in quiet comfort.", "నిశ్శబ్దంగా, హాయిగా చేరుకోండి.", "सुकून से, आराम से पहुँचिए।")}</h1>
      <p class="t-body mt12">${L("Airport rides that follow your flight, rides on repeat, and trips across the city and beyond. In an electric SUV, with our own chauffeur.", "మీ ఫ్లైట్‌ను అనుసరించే ఎయిర్‌పోర్ట్ రైడ్‌లు, రోజూ వచ్చే రైడ్‌లు, నగరంలో మరియు బయట ప్రయాణాలు. ఎలక్ట్రిక్ SUVలో, మా సొంత డ్రైవర్‌తో.", "आपकी फ़्लाइट के हिसाब से एयरपोर्ट राइड, रोज़ की राइड, और शहर के अंदर-बाहर के सफ़र। इलेक्ट्रिक SUV में, हमारे अपने ड्राइवर के साथ।")}</p>
      <div class="mt24">${btn(L("Continue with phone number", "ఫోన్ నంబర్‌తో కొనసాగండి", "फ़ोन नंबर से आगे बढ़ें"), { go: "signin", kind: "btn-stage", cls: "lg" })}</div>
      <div class="wl-langs mt16">${S.LANGS.map(l => `<button class="${S.state.lang === l.id ? "on" : ""}" data-lang="${l.id}">${l.native}</button>`).join("")}</div>
    </div>
  </div>`);

def("signin", { g: "Start", n: "Sign in", tabs: 0, nav: 1, foot: 1, what: "Mobile number and a 6-digit SMS code, auto-filled from the SMS on both platforms.", why: "No passwords. Matches how the existing app signs people in.", fl: "Android: SMS Retriever API (no SMS permission). iOS: <code>oneTimeCode</code> autofill. Backend OTP endpoint from the client." }, () => `
  ${bar(L("Sign in", "సైన్ ఇన్", "साइन इन"))}
  <div class="content"><div class="pad">
    <h1 class="t-title">${L("Your mobile number", "మీ మొబైల్ నంబర్", "आपका मोबाइल नंबर")}</h1>
    <p class="t-sub mt8">${L("We'll send a 6-digit code by SMS.", "SMS ద్వారా 6 అంకెల కోడ్ పంపుతాం.", "हम SMS से 6 अंकों का कोड भेजेंगे।")}</p>
    <div class="field mt24"><b>+91</b><span class="vline"></span><span class="t-num" style="font-size:19px;letter-spacing:.04em">98480 12345</span></div>
    <p class="t-label mt24">${L("Code from SMS", "SMS లోని కోడ్", "SMS वाला कोड")}</p>
    <div class="boxes mt8">${"427190".split("").map(d => `<span class="f">${d}</span>`).join("")}</div>
    <p class="t-sub mt12">${L("Filled in automatically from your SMS.", "మీ SMS నుండి ఆటోమేటిక్‌గా నింపబడింది.", "आपके SMS से अपने-आप भर गया।")}</p>
  </div></div>
  ${foot(btn(L("Verify and continue", "ధృవీకరించి కొనసాగండి", "पुष्टि करें और आगे बढ़ें"), { go: "setup" }))}`);

def("setup", { g: "Start", n: "Permissions", tabs: 0, nav: 1, foot: 1, what: "Explains each permission in one plain sentence before the system prompt appears.", why: "Asking with a reason raises opt-in for notifications and calendar, which the flight features depend on.", fl: "<code>permission_handler</code>. Calendar: EventKit (iOS) / CalendarContract (Android), read-only." }, () => {
  const p = (k, icon, t, s) => `<div class="permrow"><span class="pico">${I(icon)}</span><div class="grow"><div class="t1">${t}</div><div class="t2">${s}</div></div>${tgl(app.perms[k], `data-act="perm" data-k="${k}"`)}</div>`;
  return `${bar(L("Set up", "సెటప్", "सेटअप"))}
  <div class="content">
    <div class="pad"><h1 class="t-title">${L("Make SAGA work for you", "SAGA మీకు సరిపోయేలా", "SAGA को अपने हिसाब से सेट करें")}</h1>
    <p class="t-sub mt8">${L("Three permissions, each for one reason. Change them any time in Settings.", "మూడు అనుమతులు, ఒక్కోదానికి ఒక కారణం. సెట్టింగ్స్‌లో ఎప్పుడైనా మార్చవచ్చు.", "तीन अनुमतियाँ, हर एक की एक वजह। सेटिंग्स में कभी भी बदलें।")}</p></div>
    <div class="permcard mt24">
      ${p("loc", "pin", L("Location", "లొకేషన్", "लोकेशन"), L("Finds your pickup point. Used only while you book or ride.", "మీ పికప్ పాయింట్ కనుగొనడానికి. బుక్ చేసేటప్పుడు, ప్రయాణంలో మాత్రమే.", "आपका पिकअप पॉइंट ढूँढने के लिए। सिर्फ़ बुकिंग और सफ़र के दौरान।"))}
      ${p("notif", "bell", L("Notifications", "నోటిఫికేషన్లు", "नोटिफ़िकेशन"), L("Chauffeur updates, and changes to your flight.", "డ్రైవర్ అప్‌డేట్‌లు, మీ ఫ్లైట్ మార్పులు.", "ड्राइवर की जानकारी और फ़्लाइट में बदलाव।"))}
      ${p("cal", "cal", L("Calendar", "క్యాలెండర్", "कैलेंडर"), L("Spots flights in your calendar so we can suggest a pickup. We look only for flights.", "మీ క్యాలెండర్‌లో ఫ్లైట్‌లను గుర్తించి పికప్ సూచిస్తాం. ఫ్లైట్‌లను మాత్రమే చూస్తాం.", "कैलेंडर में फ़्लाइट देखकर पिकअप सुझाते हैं। हम सिर्फ़ फ़्लाइट देखते हैं।"))}
    </div>
    <div class="group mt16">${row({ icon: "globe", t: L("Language", "భాష", "भाषा"), trail: S.LANGS.find(l => l.id === S.state.lang).native, go: "language" })}</div>
  </div>
  ${foot(btn(L("Continue", "కొనసాగండి", "आगे बढ़ें"), { go: "home", attr: 'data-reset="1"' }))}`;
});

def("home", { g: "Ride", n: "Home", tab: "home", what: "Greeting, one search bar with a voice button, a flight we found, the airport card (PNR first), scheduled and intercity tiles, the car you'll ride in, and honest nearby availability.", why: "Airport rides are the core business, so they sit above the fold. The SUV showcase sells the premium before price is ever shown.", fl: "Route <code>/</code>. Flight suggestion comes from <code>GET /trips/detected</code>; nearby count from <code>GET /fleet/nearby</code>." }, () => {
  const sugg = app.sugg && !app.booked && app.travel.cal ? `
    <div class="card sugg">
      <div class="row-flex"><span class="sq">${I("plane")}</span><div class="grow"><div class="t-label">${L("Found in your calendar", "మీ క్యాలెండర్‌లో కనిపించింది", "आपके कैलेंडर में मिली")}</div><div class="t-h3">6E 2134 · ${L("Fri 20 Nov, 7:40 AM", "శుక్ర 20 నవం, ఉ. 7:40", "शुक्र 20 नवं, सुबह 7:40")}</div><div class="t-sub">Visakhapatnam → Hyderabad</div></div></div>
      <p class="t-body mt12">${L("Book a pickup at 5:20 AM? We'll track the flight and move your pickup if it changes.", "ఉదయం 5:20కి పికప్ బుక్ చేయాలా? ఫ్లైట్‌ను ట్రాక్ చేసి, మారితే పికప్ సమయం మారుస్తాం.", "सुबह 5:20 का पिकअप बुक करें? हम फ़्लाइट ट्रैक करेंगे और बदलने पर पिकअप भी बदल देंगे।")}</p>
      <div class="btnrow mt16">${btn(L("Not now", "ఇప్పుడు వద్దు", "अभी नहीं"), { kind: "btn-secondary", act: "nosugg" })}${btn(L("Book pickup", "పికప్ బుక్", "पिकअप बुक करें"), { go: "flight" })}</div>
    </div>` : "";
  const upc = (app.booked || app.series) ? `${sh(L("Coming up", "రాబోయేవి", "आने वाली"), `<button data-tab="rides">${L("All", "అన్నీ", "सभी")}</button>`)}<div class="group upc" style="margin:0 16px">
      ${app.booked ? row({ icon: "plane", t: L("Airport pickup · Fri 5:20 AM", "ఎయిర్‌పోర్ట్ పికప్ · శుక్ర ఉ. 5:20", "एयरपोर्ट पिकअप · शुक्र सुबह 5:20"), s: L("6E 2134 on time · tracking", "6E 2134 సమయానికి · ట్రాకింగ్", "6E 2134 समय पर · ट्रैकिंग चालू"), go: "booked" }) : ""}
      ${app.series ? row({ icon: "repeat", lc: "soft", t: L("Weekdays · 9:00 AM", "వారపు రోజులు · ఉ. 9:00", "सोम–शुक्र · सुबह 9:00"), s: L("Home → Office · next Mon 16 Nov", "ఇల్లు → ఆఫీస్ · తదుపరి సోమ 16 నవం", "घर → ऑफ़िस · अगली सोम 16 नवं"), tab: "rides", attr: 'data-tab="rides"' }) : ""}
    </div>` : "";
  return `<div class="content">
    <div class="home-head">${S.logo()}<div class="r"><span class="bellwrap">${hbtn("bell", 'data-go="notifications"', "Notifications")}<i></i></span><button class="avatar" data-tab="account">AR</button></div></div>
    <div class="greet"><div class="t-label">${greet()}, Ananya</div><h1 class="t-title mt4">${L("Where are you going?", "ఎక్కడికి వెళ్తున్నారు?", "आज कहाँ जाना है?")}</h1></div>
    <button class="search" data-go="where">${I("search")}<span class="ph">${L("Where to?", "ఎక్కడికి?", "कहाँ?")}</span><span class="mic" data-voice>${I("mic")}</span></button>
    <div class="chips places">
      <button class="chip" data-go="options" data-dest="Office · Dwaraka Nagar">${I("building")}${L("Office", "ఆఫీస్", "ऑफ़िस")}</button>
      <button class="chip" data-go="options" data-dest="RK Beach">${I("pin")}RK Beach</button>
      <button class="chip" data-go="options" data-dest="Railway Station">${I("pin")}${L("Railway Station", "రైల్వే స్టేషన్", "रेलवे स्टेशन")}</button>
    </div>
    ${sugg}
    <div class="air stage" data-go="airport" role="button">
      <span class="plane">${I("plane")}</span>
      ${pill("plane", L("Airport rides", "ఎయిర్‌పోర్ట్ రైడ్‌లు", "एयरपोर्ट राइड"), "dark")}

def("nocars", { g: "Ride", n: "No cars nearby", tabs: 0, nav: 1, foot: 1, what: "An honest, warm message: we're a growing start-up adding cars; here's the real wait, and here's why it's worth it. Wait in line, schedule, or get notified.", why: "Riders forgive a wait they're told about. They don't forgive a spinner. This keeps the booking instead of losing it to another app.", fl: "<code>no_cars</code> response carries <code>next_free_eta</code> and queue position. Joining the line: <code>POST /rides/{id}/waitlist</code>." }, () => `

def("schedule", { g: "Scheduled", n: "Scheduled rides", tabs: 0, nav: 1, foot: 1, what: "Pickup and drop, time, repeat days, a calendar that shows every ride (tap a date to skip it), return ride and same-chauffeur preference, and the price with the weekday-plan discount.", why: "Office and school runs are steady revenue for a small fleet, and they're planned days ahead, which helps dispatch.", fl: "Stored as an RRULE (RFC 5545) + exceptions. Server expands it 14 days ahead into real bookings so dispatch can plan." }, () => {
  const base = new Date(2026, 10, 15), Y = 2026, M = 10, first = new Date(Y, M, 1).getDay(), dim = 30;
  const end = new Date(2026, 11, 12);
  const dn = [L("S", "ఆ", "र"), L("M", "సో", "सो"), L("T", "మం", "मं"), L("W", "బు", "बु"), L("T", "గు", "गु"), L("F", "శు", "शु"), L("S", "శ", "श")];
  let cells = dn.map(d => `<span class="dn">${d}</span>`).join("");
  for (let i = 0; i < first; i++) cells += "<span></span>";
  let n = 0;
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(Y, M, d), wd = dt.getDay(), past = dt < base, sk = app.skips.includes(d);
    const on = !past && app.days.includes(wd);
    if (on && !sk) n++;
    cells += `<button class="cd ${past ? "past" : ""} ${on ? "on" : ""} ${sk ? "skip" : ""} ${d === 15 ? "today" : ""}" ${on ? `data-act="skip" data-v="${d}"` : ""}>${d}</button>`;
  }
  let dec = 0; for (let d = 1; d <= 12; d++) if (app.days.includes(new Date(2026, 11, d).getDay())) dec++;
  const rides = (n + dec) * (app.ret ? 2 : 1), per = 252, total = Math.round(rides * per * .9);
  return `${bar(L("Scheduled rides", "షెడ్యూల్ రైడ్‌లు", "शेड्यूल राइड"), { large: true })}

    <div class="pad"><div class="card" style="padding:6px 18px">
      <div class="row-flex" style="min-height:58px"><span style="width:14px;height:14px;border-radius:7px;border:4px solid var(--accent)"></span><span class="grow t-body">${L("Home · MVP Colony", "ఇల్లు · MVP కాలనీ", "घर · MVP कॉलोनी")}</span></div>
      <div class="hr" style="margin:0 0 0 28px"></div>
      <div class="row-flex" style="min-height:58px"><span style="width:14px;height:14px;border-radius:3px;background:var(--fg)"></span><span class="grow t-body">${L("Office · Dwaraka Nagar", "ఆఫీస్ · ద్వారకా నగర్", "ऑफ़िस · द्वारका नगर")}</span><span class="pill">${I("clock")}9:00 AM</span></div>
    </div></div>
    ${sh(L("Repeat on", "ఈ రోజుల్లో", "इन दिनों"))}
    <div class="pad"><div class="days">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button class="${app.days.includes(d) ? "on" : ""}" data-act="day" data-v="${d}">${dn[d]}</button>`).join("")}</div></div>
    <div class="pad mt16"><div class="card">
      <div class="calhead"><b style="font-size:18px">${L("November 2026", "నవంబర్ 2026", "नवंबर 2026")}</b><span class="t-sub">${L("Tap a date to skip", "దాటవేయడానికి తేదీ నొక్కండి", "छोड़ने के लिए तारीख़ दबाएँ")}</span></div>
      <div class="calg">${cells}</div>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>${L("Ride", "రైడ్", "राइड")}</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--fg)"></i>${L("Today", "ఈ రోజు", "आज")}</span><span style="text-decoration:line-through">${L("Skipped", "దాటవేసినవి", "छोड़ा गया")}</span></div>
    </div></div>
    <div class="group mt12">
      <div class="row"><span class="lead">${I("repeat")}</span><span class="tx"><span class="t1" style="display:block">${L("Return ride at 6:30 PM", "సా. 6:30కి తిరుగు రైడ్", "शाम 6:30 वापसी राइड")}</span></span>${tgl(app.ret, 'data-act="ret"')}</div>
      <div class="row"><span class="lead">${I("user")}</span><span class="tx"><span class="t1" style="display:block">${L("Prefer the same chauffeur", "అదే డ్రైవర్ కావాలి", "वही ड्राइवर चाहिए")}</span><span class="t2" style="display:block">${L("We'll try every day", "ప్రతి రోజు ప్రయత్నిస్తాం", "हर दिन कोशिश करेंगे")}</span></span>${tgl(app.same, 'data-act="same"')}</div>

    </div>
    <div class="pad mt12"><div class="card tint">
      <div class="row-flex"><span class="grow" style="font-weight:600;font-size:17px">${L(`${rides} rides · ₹${per} each`, `${rides} రైడ్‌లు · ఒక్కొక్కటి ₹${per}`, `${rides} राइड · ₹${per} प्रति राइड`)}</span>${pill("percent", "−10%", "")}</div>

    </div></div>
  </div>
  ${foot(btn(L(`Schedule ${rides} rides`, `${rides} రైడ్‌లు షెడ్యూల్ చేయండి`, `${rides} राइड शेड्यूल करें`), { act: "bookseries", cls: "lg" }))}`;
});

def("rides", { g: "Tabs", n: "Trips", tab: "rides", what: "Upcoming (airport pickups with live flight status, repeat series with skip/manage, intercity) and past trips with receipts.", why: "Scheduled and airport rides live here, so riders can check them days ahead.", fl: "<code>GET /rides?status=upcoming|past</code>. Series shown as one card, expanded server-side." }, () => {

    ${app.booked ? `<div class="card" data-go="booked" role="button"><div class="row-flex"><span class="sq" style="width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">${I("plane")}</span><div class="grow"><div class="t-h3">${L("Airport pickup", "ఎయిర్‌పోర్ట్ పికప్", "एयरपोर्ट पिकअप")}</div><div class="t-sub">${L(`Fri 20 Nov · ${hhmm(5, 20 + app.shift)}`, `శుక్ర 20 నవం · ${hhmm(5, 20 + app.shift)}`, `शुक्र 20 नवं · ${hhmm(5, 20 + app.shift)}`)}</div></div>${pill("check", L("On time", "సమయానికి", "समय पर"), "ok")}</div><div class="hr"></div><div class="row-flex t-sub">${I("refresh", "sm")}<span>${L("Tracking 6E 2134 · pickup moves if it does", "6E 2134 ట్రాకింగ్ · అది మారితే పికప్ మారుతుంది", "6E 2134 ट्रैक हो रही · बदली तो पिकअप भी बदलेगा")}</span></div></div>`
      : `<div class="card line" data-go="airport" role="button"><div class="row-flex"><span class="pico">${I("plane")}</span><div class="grow"><b style="font-size:17px">${L("Flying soon?", "త్వరలో ప్రయాణమా?", "जल्द उड़ान है?")}</b><div class="t-sub">${L("Add your PNR and we'll plan the pickup", "మీ PNR ఇవ్వండి, పికప్ ప్లాన్ చేస్తాం", "PNR डालें, हम पिकअप तय करेंगे")}</div></div>${I("chevr")}</div></div>`}
    <div class="card mt12"><div class="row-flex"><span class="pico">${I("repeat")}</span><div class="grow"><div class="t-h3">${L("Weekdays · 9:00 AM", "వారపు రోజులు · ఉ. 9:00", "सोम–शुक्र · सुबह 9:00")}</div><div class="t-sub">${L("Home → Office · same chauffeur", "ఇల్లు → ఆఫీస్ · అదే డ్రైవర్", "घर → ऑफ़िस · वही ड्राइवर")}</div></div></div>
      <div class="t-sub mt12">${L("Next: Mon 16 Nov · Ravi Kumar", "తదుపరి: సోమ 16 నవం · రవి కుమార్", "अगली: सोम 16 नवं · रवि कुमार")}</div>
      <div class="btnrow mt12">${btn(L("Skip next", "తదుపరి దాటవేయి", "अगली छोड़ें"), { kind: "btn-secondary", cls: "sm", toast: L("Mon 16 Nov skipped. You won't be charged.", "సోమ 16 నవం దాటవేశాం. ఛార్జ్ ఉండదు.", "सोम 16 नवं छोड़ दी। कोई चार्ज नहीं।") })}${btn(L("Manage", "నిర్వహించు", "बदलें"), { kind: "btn-secondary", cls: "sm", go: "schedule" })}</div></div>
    ${app.inter ? `<div class="card mt12 row-flex"><span class="pico">${I("route")}</span><div class="grow"><div class="t-h3">${app.idest}</div><div class="t-sub">${L("Sat 21 Nov · 7:00 AM", "శని 21 నవం · ఉ. 7:00", "शनि 21 नवं · सुबह 7:00")}</div></div></div>` : ""}`;
  const past = `<div class="group" style="margin:0">
    ${row({ icon: "receipt", lc: "grey", t: "Dwaraka Nagar", s: L(`Today, 7:41 PM · ${S.inr(FARE)}`, `ఈ రోజు, రా. 7:41 · ${S.inr(FARE)}`, `आज, शाम 7:41 · ${S.inr(FARE)}`), toast: L("Receipt emailed", "రసీదు ఇమెయిల్ చేశాం", "रसीद ईमेल की") })}
    ${row({ icon: "plane", lc: "grey", t: L("Bhogapuram Airport", "భోగాపురం ఎయిర్‌పోర్ట్", "भोगापुरम एयरपोर्ट"), s: `8 Nov · ${S.inr(AIRFARE)}`, toast: L("Receipt emailed", "రసీదు ఇమెయిల్ చేశాం", "रसीद ईमेल की") })}
    ${row({ icon: "receipt", lc: "grey", t: "RK Beach", s: "2 Nov · ₹164", toast: L("Receipt emailed", "రసీదు ఇమెయిల్ చేశాం", "रसीद ईमेल की") })}
  </div>`;
  return `${bar(L("Trips", "ప్రయాణాలు", "यात्राएँ"), { large: true, back: false })}
  <div class="content"><div class="pad">${seg([["up", L("Upcoming", "రాబోయేవి", "आने वाली")], ["past", L("Past", "గతం", "पिछली")]], app.tripSeg, "tripseg")}<div class="mt16">${app.tripSeg === "up" ? up : past}</div></div></div>`;
});

def("language", { g: "Settings", n: "Language", tabs: 0, nav: 1, what: "English, Telugu and Hindi, each written in its own script. Changes the whole app, notifications and Saathi's voice at once.", why: "Vizag riders and many chauffeurs are more comfortable in Telugu; Hindi covers visitors and many airport travellers.", fl: "ARB files per locale; server sends notification templates per user locale. Odia, Tamil, Kannada can be added without code changes." }, () => `

  <div class="content">
    <div class="group">${S.LANGS.map(l => `<button class="row" data-lang="${l.id}"><span class="tx"><span class="t1" style="display:block;font-size:19px">${l.native}</span><span class="t2" style="display:block">${l.name}</span></span><span class="trail">${S.state.lang === l.id ? `<span style="color:var(--accent-ink)">${I("check")}</span>` : ""}</span></button>`).join("")}</div>

    ${sh(L("Coming next", "త్వరలో", "जल्द आ रही"))}
    <div class="group">${[["ଓଡ଼ିଆ", "Odia"], ["தமிழ்", "Tamil"], ["ಕನ್ನಡ", "Kannada"]].map(([n, e]) => `<div class="row" style="opacity:.55"><span class="tx"><span class="t1" style="display:block">${n}</span><span class="t2" style="display:block">${e}</span></span></div>`).join("")}</div>
  </div>`);

def("voicecfg", { g: "Settings", n: "Voice", tabs: 0, nav: 1, what: "Saathi, the in-app voice assistant, in English, Telugu and Hindi. Plus the platform route: Siri shortcuts on iPhone, Gemini on Android.", why: "Voice makes the app usable for riders who don't type comfortably, in their own language.", fl: "In-app: streaming STT (Sarvam / Google) → intent API → TTS. iOS: App Intents + App Shortcuts. Android: App Actions now, AppFunctions where Gemini supports it. See brief §10." }, () => {
  const tries = { en: ["Book a ride to RK Beach", "My flight PNR is K7QX2M", "Office rides every weekday at 9", "Where is my chauffeur?"], te: ["ఆర్‌కే బీచ్‌కి రైడ్ బుక్ చేయి", "నా ఫ్లైట్ PNR K7QX2M", "ప్రతి రోజు 9 గంటలకు ఆఫీస్ రైడ్", "నా డ్రైవర్ ఎక్కడ ఉన్నారు?"], hi: ["आरके बीच के लिए राइड बुक करो", "मेरी फ्लाइट का PNR K7QX2M है", "हर दिन 9 बजे ऑफिस की राइड", "मेरा ड्राइवर कहाँ है?"] }[S.state.lang];
  const sys = ios()
    ? [["Hey Siri, book a SAGA", L("Opens a booking to your usual place", "మీ సాధారణ స్థలానికి బుకింగ్", "आपकी आम जगह के लिए बुकिंग")], ["Hey Siri, where's my SAGA?", L("Reads your chauffeur's ETA", "డ్రైవర్ ETA చదువుతుంది", "ड्राइवर का ETA बताता है")], ["Hey Siri, SAGA to the airport", L("Starts the airport flow", "ఎయిర్‌పోర్ట్ బుకింగ్ ప్రారంభం", "एयरपोर्ट बुकिंग शुरू")]]
    : [["Hey Google, book a SAGA", L("Gemini opens SAGA with the booking ready", "జెమినీ బుకింగ్‌తో SAGA తెరుస్తుంది", "Gemini बुकिंग के साथ SAGA खोलता है")], ["Hey Google, where's my SAGA?", L("Reads your chauffeur's ETA", "డ్రైవర్ ETA చదువుతుంది", "ड्राइवर का ETA बताता है")], ["Hey Google, SAGA to the airport", L("Starts the airport flow", "ఎయిర్‌పోర్ట్ బుకింగ్ ప్రారంభం", "एयरपोर्ट बुकिंग शुरू")]];
  return `${bar(L("Voice", "వాయిస్", "आवाज़"))}
  <div class="content">
    <div class="pad"><div class="card stage center" style="padding:28px 20px">
      <button class="vmic" data-voice style="margin:0 auto;width:84px;height:84px;border-radius:42px">${I("mic", "lg")}</button>
      <div class="t-h2 mt16">Saathi</div>
      <p class="t-sub mt8">${L("Use every part of SAGA by voice, in English, Telugu or Hindi.", "SAGAలో ప్రతిదీ మాటతో, ఇంగ్లీష్, తెలుగు లేదా హిందీలో.", "SAGA का हर काम आवाज़ से, अंग्रेज़ी, तेलुगु या हिंदी में।")}</p>
    </div></div>
    ${sh(L("Try saying", "ఇలా చెప్పండి", "ऐसे बोलें"))}
    <div class="group">${tries.map(t => `<button class="row" data-say="${esc(t)}"><span class="lead soft">${I("mic")}</span><span class="tx"><span class="t1" style="display:block">“${t}”</span></span></button>`).join("")}</div>

    <div class="k">Other apps</div><a class="out" href="index.html">Suite: iPhone and Android side by side →</a><a class="out" href="driver.html">Driver app →</a><a class="out" href="hotel.html">Hotel partner app →</a><a class="out" href="ops.html">Ops dashboard →</a><a class="out" href="screens.html">Screen map →</a><a class="out" href="brief.html">Client brief →</a>`;
}

/* ---------- fit to window ---------- */
const dev = $("#device");
dev.classList.add(BARE ? "bare" : S.state.os);
function fit() {
  const area = $("#stagearea"), W = area.clientWidth, H = area.clientHeight, dw = dev.offsetWidth, dh = dev.offsetHeight;
  const pad = EMBED || BARE ? 0 : 40, k = Math.min((W - pad) / dw, (H - pad) / dh, BARE ? 10 : 1);
  $("#fit").style.transform = `scale(${k})`; $("#fit").style.width = dw + "px"; $("#fit").style.height = dh + "px";
}
addEventListener("resize", fit); fit();

const start = S.qs.get("screen") || location.hash.slice(1) || "home";
go(SC[start] ? start : "home", { instant: true, tab: !!(SC[start] || SC.home).tab });
if (S.qs.has("voice")) setTimeout(BARE ? () => voiceUI("", "", true) : openVoice, 300);
})();
</script>
